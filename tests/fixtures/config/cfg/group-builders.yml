---
# Group builders are responsible for handling groups
# Note that "group" and "user" is an abstraction and
# only really means something once the builders have resolved them
group_builders:
  # posix: groups as POSIX accounts on the machines, each with its gid
  # declared on the group; no terraform root, no credentials. The default
  # group builder: every group of the tree sits on it, pxgroup
  # (groups/group-pxgroup.yaml) owning one image (images/image4.yaml).
  - name: posix-local
    is_default: true
    type: posix
# User builders handle users
user_builders:
  # posix: users as POSIX accounts, each with a user-private group of the
  # same name and id, and its public keys. The default user builder: every
  # persona of groups/users.yaml sits on it; the two at its end declare a
  # uid, the others draw theirs from the builder's id_pool.
  - name: posix-users
    is_default: true
    type: posix
