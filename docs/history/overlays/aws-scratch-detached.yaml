# stage 15 live proof: the standing test2 with the scratch mount REMOVED --
# the §10.14 detach on AWS: unmount over SSM, receipt, the whitelisted
# aws_volume_attachment destroy; scratch-ebs stays declared (active,
# unattached) -- also the shape the restore from archive runs under.
storages:
  - name: scratch-ebs
    mount_point: /mnt/scratch
    groups:
      - coops
    state: active
instances:
  - name: test2
    machine_type: t3.medium
    image: imgfile-basic-dask
    description: "AWS storage-archive proof (stage 15)"
    ephemeral: false
    tags:
      hype: test
