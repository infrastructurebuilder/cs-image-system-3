[project]
name = "cs-image-system-plugin-b"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["cs-image-system-base"]

[project.entry-points."cs_image_system.plugins.runtime"]
plugin_b = "cs_image_system.plugin_b.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
