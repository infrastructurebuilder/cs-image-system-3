---
# cfg/image-builders.yml (from the standard-aws-posix starter) -- the ONE image builder:
# packer's amazon-ebs source on the AWS runtime. Reference:
# CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 6.
image_builders:
  - name: packer-ebs
    type: packer-ebs
    is_default: true
    runtime: default             # DECISION: the default runtime (aws-main); name another runtime to bake there
    executable: packer
    required_plugins:            # packer plugins the generated template requires
      - name: amazon
        source: github.com/hashicorp/amazon
        version: ">= 1.0.0"
      - name: ansible
        source: github.com/hashicorp/ansible
        version: ">= 1.0.0"
