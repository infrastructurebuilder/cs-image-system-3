---
# cfg/os-builders.yml (from the standard-aws-posix starter) -- the ONE base image: the
# vendor image to start from, what the base declares it can do, its update
# policy and its in-bake tests. Reference: CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 5
# (5.1 `runtimes[]`, 5.2 `update`, 5.3 `tests`).
os_builders:
  - name: el10
    type: rhel                   # DECISION: the dnf family (rhel, fedora) -- `debian`/`ubuntu` are the apt families
    family: alma-linux           # what the vendor image IS; the image-source catalog says alma-linux IS rhel (CONFIGURATION 5a)
    family_version: 10           # a number reads as the string "10"; rhel accepts 8, 9 or 10
    is_default: true             # the base `source_image: default` resolves to
    # DECISION: what instances of this base may use (declared, not merely
    # possible): posix identity, and EBS volumes. An image whose group's builder
    # is of another identity type, or an instance attaching another storage
    # type, is refused at validate.
    identity_types: [posix]          # DECISION: the base can carry posix groups (the shadow tools and sudo are checked)
    storage_types: [ebs]
    # DECISION: security patches only, never the kernel. `policy: full` (or
    # `auto_update: true`) upgrades everything, which is slow enough to sever
    # an SSM build tunnel; `none` bakes the vendor image as is.
    update:
      policy: security
      exclude: ["kernel*"]
    # in-bake assertions: the bake fails if any fails. A base test can assert
    # only what the BASE bake installs or the vendor image ships: a base takes
    # no modifications (a package an image's playbook installs is tested there).
    tests:
      packages: [amazon-ssm-agent]       # the session agent, which `session_mechanism: ssm` bakes in
      commands:
        - run: "id -u csisadmin"      # the mandatory local admin user exists
    runtimes:
      - name: aws-el10
        image_builder: packer-ebs     # the image builder (and so the runtime) this base is baked on
        default_machine_type: t3.medium
        # the vendor-image query comes from the image-source catalog (the
        # release's `aws` block for alma-linux: the AlmaLinux OS Foundation's
        # public account, "AlmaLinux OS 10*x86_64*"); `validate` prints what
        # will be asked. To narrow or replace it, declare `query:` here in the
        # system's vocabulary (CONFIGURATION 5a), or add a family entry to
        # cfg/image-sources.yml.
