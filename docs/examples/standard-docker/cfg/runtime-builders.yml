---
# cfg/runtime-builders.yml (from the standard-docker starter) -- the one docker runtime:
# where images are baked and instances stand, on the container daemon of a
# host. Reference: CONFIGURATION.md (the system repository's docs/CONFIGURATION.md)
# section 4 (4.1 common fields, 4.2 every runtime, 4.6 `docker`).
#
# No cloud, no account, no credential: any daemon that speaks the Docker Engine API
# serves (Docker Engine, Docker Desktop, OrbStack, colima, Podman's API service).
# WHOEVER CAN REACH THE DAEMON IS ROOT ON ITS HOST. The system says so rather than
# hiding it: guard the host, and give CI a key to it only if you accept that.
runtime_builders:
  - name: docker-main
    type: docker
    is_default: true             # DECISION: the runtime `runtime: default` resolves to; at most one per class
    aliases: [docker]            # DECISION: extra names other declarations may use
    description: "The team's container host"
    # DECISION: this runtime names NO address, so every docker call uses the daemon the
    # CALLER'S ENVIRONMENT names: DOCKER_HOST, else the local socket. That is the daemon of
    # the machine you run the tool on, which is how this tree works as it stands on a laptop
    # with Docker Desktop or OrbStack. For a durable host, name it here instead, one of:
    #   host: ssh://docker-host.example         # a DOCKER_HOST URL (unix://, ssh://, tcp:// with TLS);
    #                                           # may be an ENC[age:...] marker when the address is private
    #   context: my-docker-context              # or a docker context's name
    # CI reaches a host through the workflow's DOCKER_HOST_* values (CI_SETUP.md 3.4a); that
    # needs no `host:` here, only the address in the workflow.
    executable: docker             # the cfg/executables.yml entry every docker call runs through
    repository: csis/standard-docker  # where builds are tagged (`<repository>:<final name>`); default csis/<runtime name>
    state_configuration: local-state  # DECISION: the docker roots keep their state on the local backend (cfg/state-backends.yml): no cloud session is needed
    credentials: {}                # nothing: there is no credential to name
    ephemeral: false
    retention_keep: 3              # builds kept per series when retention is applied
    tags:                          # labels applied to everything the runtime creates
      project: REPLACE-ME
      environment: development
    default_machine_type: small    # DECISION: must name one of machine_types
    default_image_builder: packer-docker  # the image builder used when an image's runtime entry names none
    machine_types:                 # DECISION: the limits a container of each type runs under (--cpus, --memory)
      small: { cpus: 1, memory: 1g }
      medium: { cpus: 2, memory: 4g }
    networking:                    # a network by NAME, referenced and never created; no subnets, no zones
      network: bridge
