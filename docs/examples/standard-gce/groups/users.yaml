---
# groups/users.yaml (from the standard-gce starter) -- the roster. Reference:
# CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 11.6 (users) and 13 (encrypted values).
# A user's `name` is the bare OPA username that group members/admins lists
# use, and it is committed IN CLEAR by decision (2026-10-14): the identity
# roots, meta-state/identity.yaml and the login proofs carry it in clear
# whatever the roster does, so a marker on it hides nothing. The personal
# names and the e-mail (its domain in particular) may be ENC[age:...]
# markers encrypted to the tree's recipients; ANY value may be one, and it
# decrypts at load when CSIS_CONFIG_IDENTITY names an identity. These two
# are synthetic personas (the frozen fixture's); their addresses derive
# from the user builder's template.
users:
  - name: avery.alpha
    first_name: Avery            # DECISION: first/last names in clear (required, never derived from the name); encrypt them too if they are sensitive
    last_name: Alpha
  - name: casey.charlie
    first_name: Casey
    last_name: Charlie
