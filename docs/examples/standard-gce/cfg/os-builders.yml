---
# cfg/os-builders.yml (from the standard-gce starter) -- the ONE base image: the
# vendor image to start from, what the base declares it can do, its update
# policy and its in-bake tests. Reference: CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 5
# (5.1 `runtimes[]`, 5.2 `update`, 5.3 `tests`).
os_builders:
  - name: el10
    type: rhel                   # DECISION: the dnf family (rhel, fedora) -- `debian`/`ubuntu` are the apt families
    family: alma-linux           # what the vendor image IS; the image-source catalog says alma-linux IS rhel (CONFIGURATION 5a)
    family_version: 10
    is_default: true
    # DECISION: what instances of this base may use: OPA identity and
    # persistent disks (`pd`). `filestore` and `gcs` are the other GCE tokens.
    identity_types: [okta]
    storage_types: [pd]
    update:
      policy: security           # DECISION: security patches only; `full` upgrades everything, `none` bakes the vendor image as is
      exclude: ["kernel*"]
    # a base test asserts only what the base bake installs or the vendor image ships
    tests:
      packages: [google-guest-agent]   # the guest agent is what makes a GCE image bootable with keys
      commands:
        - run: "id -u csisadmin"
    runtimes:
      - name: gce-el10
        image_builder: packer-gce
        default_machine_type: e2-small
        # DECISION: one ssh user for every GCE bake. Left unset, the base bake
        # and the instance bake would use different names, and the guest agent
        # aborts its key setup when it cannot remove the stale other user.
        ssh_username: packer
        # the vendor-image query comes from the image-source catalog (the
        # release's `gcloud` block for alma-linux: project almalinux-cloud,
        # family almalinux-10, the x86_64 line); `validate` prints what will
        # be asked. To narrow or replace it, declare `query:` here in the
        # system's vocabulary (CONFIGURATION 5a), or add a family entry to
        # cfg/image-sources.yml.
