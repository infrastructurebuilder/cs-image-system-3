---
# docs/examples/standard-gce/instances/instances.yaml -- the ONE instance.
# Reference: ../../../CONFIGURATION.md section 11.3 (11.3.1 `storages[]`).
# An instance declares no group: it belongs to its image's group. A storage
# attachment is legal only when that group is on the storage's allowed list.
instances:
  - name: team-node-1            # DECISION: a hostname label (letters, digits, hyphens; at most 63) -- the OS hostname and the OPA canonical name
    image: team-node
    type: tofu-gce               # the instance builder (the default here; named for clarity)
    runtime: gcp-main            # the runtime (the default here; named for clarity)
    machine_type: e2-micro       # DECISION: the free-tier size; empty would take the runtime's default_machine_type
    description: "The team's standing node"
    # DECISION: durable (the default); `ephemeral: true` would launch, verify
    # and destroy it in the same run. `image_policy: pinned` (the default)
    # keeps the launched build until an explicit `upgrade instance`.
    storages:
      - name: data
        mount_point: /mnt/data
    tags:
      role: node
