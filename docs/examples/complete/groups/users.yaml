# groups/users.yaml (from the complete starter) -- the roster: the frozen
# fixture's nineteen synthetic personas (avery.alpha ... sawyer), every
# identifying value an ENC[age:...] marker opened by the TEST identity, plus
# one MANAGED user showing every profile field. Reference:
# CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 11.6 (users) and 13 (encrypted values).
# A user's name is the bare OPA username that group members/admins lists
# use; the address is explicit, or derived from the user builder's
# template; first_name/last_name are required data, never derived.
