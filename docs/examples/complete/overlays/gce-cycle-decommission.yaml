# overlays/gce-cycle-decommission.yaml (from the complete starter) -- the overlay
# `undeclare` form: gce-node is undeclared for this invocation, so a standing
# gce-node is decommissioned through the gate. The flag form of the same
# thing is `--undeclare instance:gce-node`. Reference:
# CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 12.
config:
  apply_instances: [gcloud-east1]
instances:
  - name: gce-node
    undeclare: true
