---
# cfg/image-builders.yml (from the complete starter) -- four image builders, one
# per runtime, every one `type: packer`: the builder's body is the same for all of
# them and the runtime plugin owns the source block. Reference: CONFIGURATION.md
# (the system repository's docs/CONFIGURATION.md) section 6.
image_builders:
  - name: pckr-ebs-ans
    type: packer
    is_default: true
    runtime: default               # the runtime this builder bakes on (aws-east2)
    executable: packer
    description: "amazon-ebs source, ansible and shell provisioners"
    default_machine_type: default  # machine type for bakes when the image and the runtime entry name none (`default` = the runtime's)
    required_plugins:              # {name (required), version (required), source, config}
      - name: amazon
        source: github.com/hashicorp/amazon
        version: ">= 1.0.0"
        config: {}
      - name: ansible
        source: github.com/hashicorp/ansible
        version: ">= 1.0.0"
  - name: pckr-ebs-east1
    type: packer
    runtime: aws-east1
    executable: packer-next        # the second packer entry, by name
    default_machine_type: t3.medium
    required_plugins:
      - name: amazon
        source: github.com/hashicorp/amazon
        version: ">= 1.0.0"
      - name: ansible
        source: github.com/hashicorp/ansible
        version: ">= 1.0.0"
  - name: pckr-gce-ans
    type: packer
    runtime: gcloud-east1
    executable: packer
    required_plugins:
      - name: googlecompute
        source: github.com/hashicorp/googlecompute
        version: ">= 1.0.0"
      - name: ansible
        source: github.com/hashicorp/ansible
        version: ">= 1.0.0"
  - name: pckr-docker-ans
    type: packer                   # on a docker runtime: the runtime emits the `docker` source and tags the result
    runtime: docker-host
    executable: packer
    required_plugins:
      - name: docker
        source: github.com/hashicorp/docker
        version: ">= 1.0.0"
      - name: ansible
        source: github.com/hashicorp/ansible
        version: ">= 1.0.0"
