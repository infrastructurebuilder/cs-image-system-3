---
# docs/examples/complete/cfg/mod-builders.yml -- both modification builders,
# every field. Reference: ../../../CONFIGURATION.md section 7 (7.1 `ansible`,
# 7.2 `bash-remote`, 7.3 the modification item inside an image).
mod_builders:
  - name: ansible-default
    type: ansible
    is_default: true               # an item with no `type` is an ansible item
    executable: ansible-playbook
    description: "playbooks become one provisioner \"ansible\" each"
    # 7.1: no builder-level playbooks -- an item's playbooks are its own
    extra_arguments: ["--diff"]    # the provisioner's extra_arguments (the system appends the interpreter)
    ansible_connection: null       # the provisioner's connection_type; normally unset
    expect_disconnect: false       # the provisioner's expect_disconnect
    configuration_user: null       # accepted; the provisioner's user comes from the bake ssh user
    config:                        # free-form
      key1: value1
  - name: bash-remote
    type: bash-remote
    aliases: [bash, shell]
    executable: bash
    # the shell provisioner's execute_command. Left null: the provisioner's
    # default (`chmod +x {{ .Path }}; {{ .Vars }} {{ .Path }}` in packer's
    # Go-template syntax) serves. A value here cannot carry packer's own
    # `{{ ... }}` forms: every string under cfg/ is rendered with Jinja
    # (section 1.1) and a Jinja-escaped literal is rendered again when the
    # model resolves, so `{{ .Path }}` fails the load either way.
    execute_command: null
    environment_vars: ["CSIS_MOD=1"]   # the provisioner's environment_vars
    expect_disconnect: false       # accepted
    extra_arguments: []            # accepted; not emitted
    configuration_user: null       # accepted; not emitted
    config:
      note: "items give script (inline lines), scripts (files) and/or ensure (declarative)"
