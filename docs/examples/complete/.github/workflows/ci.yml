name: CI

# The CI of a cs-image-system CONFIGURATION repository. Every command is a `just`
# target of this tree, so CI and a person's shell run the same thing. Three jobs:
#   verify   needs no secret: the tree must be public-safe and its Justfile must parse
#   live     read-only against both clouds and OPA: validate, is the committed emission
#            current, the strict state query, the modification tests under docker;
#            pushes and the nightly schedule, never pull requests
#   perform  on main alone: the record (a full dry run, committed and pushed first, so a
#            record exists whatever happens next), the guard on a runtime CI must never
#            bake on, the performing run of PERFORM_RUNTIME under the WRITE identity,
#            the login proof as a workload, the closing record (pushed even when the
#            performing step failed, so nothing baked goes unrecorded), the strict
#            state query
# Each job is gated on the secrets the team provides: none configured is SKIPPED
# and said so in the job summary; some configured and some missing is a FAILURE
# that names them (a secret that exists with no value reads as missing).
#
# REPLACE-ME: the runtime CI performs on, a runtime that must never bake in CI (or
# nothing), the region, and the team's TF_VAR names (the OPA key pair is
# TF_VAR_<team>_key / TF_VAR_<team>_secret, the team name with non-alphanumerics as `_`).
# Nothing in this file is a credential.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * *"        # nightly (UTC): the strict state query, drift
  workflow_dispatch:
    inputs:
      mode:
        description: "dry enumerates the performing run; record commits, performs and pushes (honoured only on main)"
        type: choice
        options: [dry, record]
        default: dry

env:
  PERFORM_RUNTIME: aws-REPLACE-ME          # the runtime `perform` drives (cfg/runtime-builders.yml)
  GUARD_RUNTIME: ""                        # REPLACE-ME or empty: a runtime CI must never bake on; its emission may not change between records
  AWS_REGION: us-east-2                    # REPLACE-ME
  # a version pin for the release CI installs: the content of .csis-version, else the latest on PyPI
  CSIS_VERSION_FILE: .csis-version

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install the released system
        run: |
          pin=""; [ -s "$CSIS_VERSION_FILE" ] && pin="==$(cat "$CSIS_VERSION_FILE")"
          indexes=""
          case "$pin" in *.dev*) indexes="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/" ;; esac
          uv tool install $indexes "cs-image-system${pin}"
          cs-image-system --help >/dev/null
      - name: The Justfile parses and lists its recipes
        run: just --list >/dev/null
      - name: Public-safe
        run: just public-safe

  live:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC federation for the read-only cloud identities
      contents: read
    env:
      OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
      TF_VAR_REPLACE_ME_key: ${{ secrets.TF_VAR_KEY }}          # REPLACE-ME: TF_VAR_<team>_key
      TF_VAR_REPLACE_ME_secret: ${{ secrets.TF_VAR_SECRET }}    # REPLACE-ME: TF_VAR_<team>_secret
    steps:
      - name: Gate on the secrets
        id: gate
        env:
          HAVE_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY != '' }}
          HAVE_TF_VAR_KEY: ${{ secrets.TF_VAR_KEY != '' }}
          HAVE_TF_VAR_SECRET: ${{ secrets.TF_VAR_SECRET != '' }}
          HAVE_CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY != '' }}
        run: |
          # A MISSING secret and an EMPTY one read the same here, so the decision is made on the
          # set: none configured is an unconfigured repository -- SKIPPED, and said so in the job
          # summary, because a green conclusion is not proof that a step ran; some configured and
          # some missing is configured-and-broken -- a FAILURE that names them.
          names="AWS_ROLE_ARN GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT OKTA_API_PRIVATE_KEY TF_VAR_KEY TF_VAR_SECRET CSIS_CONFIG_IDENTITY"
          missing=""; present=0
          for name in $names; do
            have="HAVE_$name"
            if [ "${!have}" = true ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "live: SKIPPED -- no secret is configured, so no step runs (AWS_ROLE_ARN: a federated READ-ONLY AWS role; GCP_WORKLOAD_IDENTITY_PROVIDER: the workload identity provider; GCP_SERVICE_ACCOUNT: the read-only GCP identity the runtime discovers its network with; OKTA_API_PRIVATE_KEY: the Okta API app's private key; TF_VAR_KEY: the OPA API key; TF_VAR_SECRET: the OPA API secret; CSIS_CONFIG_IDENTITY: the age identity that opens the tree's ENC values)"
            { echo "## live: SKIPPED"; echo "No secret is configured; no step ran. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "live: FAILED -- secrets are configured but these are missing or EMPTY:$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2
      - if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install the released system
        if: steps.gate.outputs.ready == 'true'
        # pinned by .csis-version when present; a development version lives on TestPyPI, with
        # PyPI as the extra index for the third-party packages (uv gives the extra index priority)
        run: |
          pin=""; [ -s "$CSIS_VERSION_FILE" ] && pin="==$(cat "$CSIS_VERSION_FILE")"
          indexes=""
          case "$pin" in *.dev*) indexes="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/" ;; esac
          uv tool install $indexes "cs-image-system${pin}"
          cs-image-system --help >/dev/null
      - name: Install OpenTofu
        if: steps.gate.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@v1
      - name: Install Packer
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-packer@main
      - name: Place the tools where cfg/executables.yml pins them
        if: steps.gate.outputs.ready == 'true'
        # validate checks every declared tool at its declared path and version
        run: |
          for tool in tofu packer gcloud ansible-playbook bash docker; do
            [ -x "/usr/local/bin/$tool" ] || { src="$(command -v "$tool" || true)"; [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$tool"; }
          done
      - name: Federated AWS credentials, the read-only role
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        # botocore ignores the environment keys once a profile is NAMED, so the profile the
        # runtime names (credentials.profile_name) must exist in a credentials file
        run: |
          mkdir -p ~/.aws
          profile=$(grep -m1 'profile_name:' cfg/runtime-builders.yml | awk '{print $2}')
          printf '[profile %s]\nregion = %s\n' "$profile" "$AWS_REGION" > ~/.aws/config
          printf '[%s]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$profile" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
      - name: Federated GCP credentials, the read-only identity
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: The identity that opens the tree
        if: steps.gate.outputs.ready == 'true'
        run: |
          umask 077; printf '%s\n' "${{ secrets.CSIS_CONFIG_IDENTITY }}" > "$RUNNER_TEMP/age-identity"
          echo "CSIS_CONFIG_IDENTITY=$RUNNER_TEMP/age-identity" >> "$GITHUB_ENV"
          cs-image-system --root-dir . mask        # every encrypted value masked in this log before anything prints
      - name: Validate
        if: steps.gate.outputs.ready == 'true'
        run: just validate
      - name: Is the committed emission current with the declarations?
        if: steps.gate.outputs.ready == 'true'
        run: just config-drift
      - name: Reality matches the records (state query --strict)
        if: steps.gate.outputs.ready == 'true'
        run: just state-query --strict
      - name: Modification tests under docker
        if: steps.gate.outputs.ready == 'true'
        run: just test-mods --strict
      - name: Remove the private mirror
        # the mirror holds the plaintext of everything the emission carries as ciphertext;
        # its own step, always(), so a failure never leaves it on the runner
        if: always() && steps.gate.outputs.ready == 'true'
        run: just mirror-clean

  perform:
    needs: live
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: perform            # two merges never record or perform at once
      cancel-in-progress: false # a record in flight is never cancelled
    permissions:
      id-token: write
      contents: write           # the records are committed and pushed back here
    env:
      OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
      TF_VAR_REPLACE_ME_key: ${{ secrets.TF_VAR_KEY }}          # REPLACE-ME: TF_VAR_<team>_key
      TF_VAR_REPLACE_ME_secret: ${{ secrets.TF_VAR_SECRET }}    # REPLACE-ME: TF_VAR_<team>_secret
    steps:
      - name: Gate on the secrets and decide the mode
        id: gate
        env:
          HAVE_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY != '' }}
          HAVE_TF_VAR_KEY: ${{ secrets.TF_VAR_KEY != '' }}
          HAVE_TF_VAR_SECRET: ${{ secrets.TF_VAR_SECRET != '' }}
          HAVE_CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY != '' }}
          HAVE_AWS_APPLY_ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN != '' }}
          HAVE_GCP_APPLY_SERVICE_ACCOUNT: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT != '' }}
          IS_RECORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'record') }}
        run: |
          # A MISSING secret and an EMPTY one read the same here, so the decision is made on the
          # set: none configured is an unconfigured repository -- SKIPPED, and said so in the job
          # summary, because a green conclusion is not proof that a step ran; some configured and
          # some missing is configured-and-broken -- a FAILURE that names them.
          names="AWS_ROLE_ARN GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT OKTA_API_PRIVATE_KEY TF_VAR_KEY TF_VAR_SECRET CSIS_CONFIG_IDENTITY"
          if [ "$IS_RECORD" = true ]; then names="$names AWS_APPLY_ROLE_ARN GCP_APPLY_SERVICE_ACCOUNT"; fi
          missing=""; present=0
          for name in $names; do
            have="HAVE_$name"
            if [ "${!have}" = true ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$IS_RECORD" = true ] && [ -n "$missing" ]; then
            echo "perform: FAILED -- recording was requested on main and these secrets are missing or EMPTY:$missing"
            exit 1
          elif [ "$present" -eq 0 ]; then
            echo "perform: SKIPPED -- no secret is configured, so no step runs (AWS_ROLE_ARN: a federated READ-ONLY AWS role; GCP_WORKLOAD_IDENTITY_PROVIDER: the workload identity provider; GCP_SERVICE_ACCOUNT: the read-only GCP identity the runtime discovers its network with; OKTA_API_PRIVATE_KEY: the Okta API app's private key; TF_VAR_KEY: the OPA API key; TF_VAR_SECRET: the OPA API secret; CSIS_CONFIG_IDENTITY: the age identity that opens the tree's ENC values; when recording also AWS_APPLY_ROLE_ARN: the federated WRITE role that trusts main alone; GCP_APPLY_SERVICE_ACCOUNT: the GCP identity that may write, trusted from main alone)"
            { echo "## perform: SKIPPED"; echo "No secret is configured; no step ran. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "perform: FAILED -- secrets are configured but these are missing or EMPTY:$missing"
            exit 1
          elif [ "$IS_RECORD" = true ]; then
            echo "perform: mode RECORD -- the full run commits the emission and meta-state, the runtime performs, and they are pushed"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "perform: mode DRY -- the full run enumerates; nothing is committed, nothing performs, nothing is pushed"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2
      - if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install the released system
        if: steps.gate.outputs.ready == 'true'
        # pinned by .csis-version when present; a development version lives on TestPyPI, with
        # PyPI as the extra index for the third-party packages (uv gives the extra index priority)
        run: |
          pin=""; [ -s "$CSIS_VERSION_FILE" ] && pin="==$(cat "$CSIS_VERSION_FILE")"
          indexes=""
          case "$pin" in *.dev*) indexes="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/" ;; esac
          uv tool install $indexes "cs-image-system${pin}"
          cs-image-system --help >/dev/null
      - name: Install OpenTofu
        if: steps.gate.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@v1
      - name: Install Packer
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-packer@main
      - name: Place the tools where cfg/executables.yml pins them
        if: steps.gate.outputs.ready == 'true'
        # validate checks every declared tool at its declared path and version
        run: |
          for tool in tofu packer gcloud ansible-playbook bash docker; do
            [ -x "/usr/local/bin/$tool" ] || { src="$(command -v "$tool" || true)"; [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$tool"; }
          done
      - name: Federated AWS credentials, the read-only role
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        # botocore ignores the environment keys once a profile is NAMED, so the profile the
        # runtime names (credentials.profile_name) must exist in a credentials file
        run: |
          mkdir -p ~/.aws
          profile=$(grep -m1 'profile_name:' cfg/runtime-builders.yml | awk '{print $2}')
          printf '[profile %s]\nregion = %s\n' "$profile" "$AWS_REGION" > ~/.aws/config
          printf '[%s]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$profile" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
      - name: Federated GCP credentials, the read-only identity
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: The identity that opens the tree
        if: steps.gate.outputs.ready == 'true'
        run: |
          umask 077; printf '%s\n' "${{ secrets.CSIS_CONFIG_IDENTITY }}" > "$RUNNER_TEMP/age-identity"
          echo "CSIS_CONFIG_IDENTITY=$RUNNER_TEMP/age-identity" >> "$GITHUB_ENV"
          cs-image-system --root-dir . mask        # every encrypted value masked in this log before anything prints
      - name: Name the committer for the record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # the RUN commits into this repository, and a runner has no git identity of its own
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prove write access to this repository
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        id: proof
        # fail fast, before the record is written; remember HEAD for the guard below
        run: |
          git push --dry-run origin HEAD:main
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The full run, recorded
        id: record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # full and unscoped: any filter would make the emission partial and the commit would
        # then delete everything out of scope
        run: just record
      - name: The full run, not recorded
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record != 'true'
        run: just dry
      - name: Push the record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # the run commits; this job pushes. A non-fast-forward means a person committed while
        # the run was in flight: fail loudly, never force
        run: |
          git log --oneline -1
          git push origin HEAD:main
      - name: The guarded runtime stays out of CI, so a change there fails loudly
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # the guarded runtime's emission in the record just pushed, against the previous
        # record: a declaration change on a runtime CI must never bake on fails here,
        # before anything performs (the record is already pushed)
        run: |
          if [ -n "$GUARD_RUNTIME" ]; then
            just runtime-unchanged "$GUARD_RUNTIME" "${{ steps.proof.outputs.before }}"
          else
            echo "no runtime is guarded (GUARD_RUNTIME is empty)"
          fi
      - name: Install what a bake and the login proof need on the runner
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # the emitted AWS sources reach their build instance through Session Manager (no public
        # IP), which packer drives through this plugin; the ansible provisioner runs
        # ansible-playbook on the runner; the OPA client makes the login proof
        run: |
          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          uv tool install ansible-core
          sudo ln -sf "$HOME/.local/bin/ansible-playbook" /usr/local/bin/ansible-playbook
          just sft-install
      - name: Federated AWS credentials, the WRITE role
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # botocore ignores the environment keys once a profile is NAMED, so the profile the
        # runtime names (credentials.profile_name) must exist in a credentials file
        run: |
          mkdir -p ~/.aws
          profile=$(grep -m1 'profile_name:' cfg/runtime-builders.yml | awk '{print $2}')
          printf '[profile %s]\nregion = %s\n' "$profile" "$AWS_REGION" > ~/.aws/config
          printf '[%s]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$profile" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
      - name: Federated GCP credentials, the identity that may write
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      - if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: The runtime performs
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # bakes what is due on PERFORM_RUNTIME, releases, applies retention; the instance roots
        # plan and gate only; commits its meta-state
        run: just cloud-perform "$PERFORM_RUNTIME"
      # The closing steps run after a FAILED performing step, but only once the first record
      # was made: a failure before it has nothing to close
      - name: Push what the performing run committed
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        run: |
          git log --oneline -1
          git push origin HEAD:main
      - name: Federated AWS credentials, the read-only role again
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Name the federated credentials as the configuration's profile
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        # botocore ignores the environment keys once a profile is NAMED, so the profile the
        # runtime names (credentials.profile_name) must exist in a credentials file
        run: |
          mkdir -p ~/.aws
          profile=$(grep -m1 'profile_name:' cfg/runtime-builders.yml | awk '{print $2}')
          printf '[profile %s]\nregion = %s\n' "$profile" "$AWS_REGION" > ~/.aws/config
          printf '[%s]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$profile" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
      - name: Federated GCP credentials, the read-only identity again
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
      - name: CI logs in through the managed policy
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        # as the WORKLOAD: this run's OIDC token, the team's connection and role from the
        # configuration; a stopped machine is skipped, never started; the verdicts are recorded
        # and the closing record commits them
        run: just ci-login-proof --runtime "$PERFORM_RUNTIME"
      - name: The full run, recorded again
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        # the complete emission after the scoped run, and the bake's lineage: runs even when
        # the performing step failed, so nothing baked goes unrecorded
        run: just record
      - name: Push the closing record
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        run: |
          git log --oneline -1
          git push origin HEAD:main
      - name: Reality matches the records (state query --strict)
        if: steps.gate.outputs.ready == 'true'
        run: just state-query --strict
      - name: Remove the private mirror
        if: always() && steps.gate.outputs.ready == 'true'
        run: just mirror-clean
