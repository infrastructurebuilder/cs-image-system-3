---
# storages/storages-docker.yaml (from the complete starter) -- a named volume on
# the docker host. Reference: CONFIGURATION.md (the system
# repository's docs/CONFIGURATION.md) section 11.4 and 8.2. The daemon mounts a
# volume at the declared path before the container's first command; the launch
# script only makes the group's subtree.
storages:
  - name: docker_scratch
    type: docker-volumes           # many containers may mount one volume; it lives in no zone
    runtime: docker-host
    mount_point: /mnt/scratch
    groups: [coops]
    state: active
