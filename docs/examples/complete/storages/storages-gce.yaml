---
# storages/storages-gce.yaml (from the complete starter) -- the three GCE storage
# kinds. Reference: CONFIGURATION.md (the system repository's docs/CONFIGURATION.md) section 11.4 and 8.2.
storages:
  - name: gce_data
    type: gcp-pd                   # zonal disk, single-attach; archived = snapshot + delete on GCE too
    # the availability-zone check reads the BUILDER's runtime; this field is the
    # fallback for a builder that names none, and naming it here keeps the item
    # readable on its own
    runtime: gcloud-east1
    mount_point: /mnt/gce-data
    groups: [coops]
    state: active
    availability_zone: us-east1-b  # 12a: a persistent disk is zonal
  - name: gce_share
    type: gcp-filestore            # shared NFS, many instances
    groups: [coops]
    share_mode: "2775"
  - name: gce_bucket
    type: gcp-gcs                  # a bucket; regional, no POSIX
    bucket_name: complete-example-REPLACE-ME-gcs-bucket
    public_read: true
