name: OPA workload probe

# Prove that GitHub's OIDC token for THIS repository validates against the team's
# workload connection BEFORE the connection is activated. Dispatch only. It
# authenticates and stops: against a draft connection OPA accepts the token and
# issues one in reply, which the probe reports and discards; nothing logs in until
# the connection is activated, and the system's login proof refuses a draft. Its second
# line says whether the issued token carries the ROLE (`role <name>: granted` from the
# pinned branch alone, judged by resolving a standing machine of a managed group), which
# is how the role's branch pin is proved: once from `main`, once from any other branch
# (CI_SETUP.md, section 3.5, step 6). Inputs reach the recipe
# through the environment, never interpolated into a shell line.
# REPLACE-ME: the defaults are the team's names (CI_SETUP.md, section 3.5,
# says how they are decided); another dispatch may pass others.
on:
  workflow_dispatch:
    inputs:
      connection:
        description: "the workload connection's name"
        type: string
        default: REPLACE-ME
      role:
        description: "the workload role's name (the role hint)"
        type: string
        default: REPLACE-ME
      team:
        description: "the OPA team"
        type: string
        default: REPLACE-ME
      opa_addr:
        description: "the OPA address"
        type: string
        default: https://REPLACE-ME.pam.okta.com

jobs:
  probe:
    runs-on: ubuntu-24.04
    container:
      # The runner image (stage 92): AlmaLinux 10 with every tool a job calls at a pinned
      # version (docs/CI_RUNNER.md lists them); moved by `init-config --force` with the
      # release's other lines. The host's docker socket lets the modification tests drive
      # the host daemon through the image's docker client.
      # Unset, CSIS_RUNNER_IMAGE is this release's image and the job logs in to ghcr.io with its own
      # token, as the runner always did (an empty credential is invalid). A team that runs its own
      # build names it in the variable; a registry other than ghcr.io needs the variable
      # CSIS_RUNNER_IMAGE_USERNAME and the secret CSIS_RUNNER_IMAGE_PASSWORD. Release refreshes never
      # touch them (stage 66).
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    permissions:
      packages: read          # the runner image is pulled with this job's token (stage 92): a permissions block without it reads as none
      id-token: write          # GitHub mints the OIDC token the connection validates
      contents: read
    env:
      OPA_WORKLOAD_CONNECTION: ${{ inputs.connection }}
      OPA_WORKLOAD_ROLE: ${{ inputs.role }}
      SFT_TEAM: ${{ inputs.team }}
      OPA_ADDR: ${{ inputs.opa_addr }}
      CSIS_VERSION_FILE: .csis-version
    steps:
      - uses: actions/checkout@v5
      - name: Install the released system
        run: |
          pin=""; [ -s "$CSIS_VERSION_FILE" ] && pin="==$(cat "$CSIS_VERSION_FILE")"
          indexes=""
          # PyPI first (uv ranks --extra-index-url above --index-url), and TestPyPI only for what PyPI
          # cannot satisfy: the pinned .dev packages. uv's default strategy stops at the first index
          # that has a name at all, and PyPI has had cs-image-system since 0.1.1 (stage 99).
          case "$pin" in *.dev*) indexes="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --index-strategy unsafe-first-match" ;; esac
          uv tool install $indexes "cs-image-system${pin}"
      - name: Present this run's token to the workload connection
        run: just opa-workload-probe
