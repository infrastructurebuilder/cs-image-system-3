# docs/examples/standard-aws/overlays/launch.yaml -- one invocation's
# permission to apply the instance root: `cs-image-system --overlay
# overlays/launch.yaml --no-dry-run run --all`. Reference:
# ../../../CONFIGURATION.md section 12. The generated runner script carries
# the overlay and `apply-check` re-reads it at execution, so the script
# applies only under this overlay.
config:
  apply_instances: [aws-main]    # a LIST: only the roots of this runtime may apply
