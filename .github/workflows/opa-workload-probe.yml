name: OPA workload probe

# Stage 56 step 2: prove that GitHub's OIDC token for THIS repository validates
# against the team's workload connection BEFORE the connection is activated.
# Dispatch only. It authenticates and stops: against a draft connection OPA
# validates the token and issues nothing usable, so the run can reach nothing.
# The names default to the ones WORKLOAD_CONNECTION.md decides; another team
# dispatches it with theirs. Inputs reach the recipe through the environment,
# never interpolated into a shell line.
on:
  workflow_dispatch:
    inputs:
      connection:
        description: "the workload connection's name"
        type: string
        default: github-cs-image-system
      role:
        description: "the workload role's name (the role hint)"
        type: string
        default: cs-image-system-ci
      team:
        description: "the OPA team"
        type: string
        default: nos-coastal-modeling-cloud-sandbox
      opa_addr:
        description: "the OPA address"
        type: string
        default: https://noaa.pam.okta.com

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # GitHub mints the OIDC token the connection validates
      contents: read
    env:
      OPA_WORKLOAD_CONNECTION: ${{ inputs.connection }}
      OPA_WORKLOAD_ROLE: ${{ inputs.role }}
      SFT_TEAM: ${{ inputs.team }}
      OPA_ADDR: ${{ inputs.opa_addr }}
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install the OPA client
        run: just sft-install
      - name: Present this run's token to the workload connection
        run: just opa-workload-probe
