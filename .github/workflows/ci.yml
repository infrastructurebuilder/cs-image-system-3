name: CI

# Every command is a `just` target, so CI and a developer's shell run the same
# thing. Four jobs: `verify` is the acceptance bar and needs neither
# configuration nor credentials; `live` drives the live configuration read-only;
# `perform` records the full configuration on `main`, performs on the AWS
# runtime under the write role and records again; `publish` uploads a pushed
# `v*` tag to the index (TestPyPI always, PyPI for a final version). Each is
# gated on the secrets the operator provides -- until they exist every leg
# reports SKIPPED and the job passes.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * *"        # nightly (UTC): drift and the strict state query on the live configuration
  workflow_dispatch:
    inputs:
      mode:
        description: "dry enumerates the run; record commits and pushes it (honoured only on main)"
        type: choice
        options: [dry, record]
        default: dry

jobs:
  verify:
    # The bar: lint, type-check (blocking since pyright reached 0 errors, stage 23)
    # and the fast suite over the frozen fixture (stage 28). Every push and PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: just init

      - name: Verify
        run: just verify

      - name: Public-safe
        # stage 35: nothing in the checkout may be material that must never be public
        run: just public-safe

  live:
    # The live configuration (cs-image-system-testconfig, checked out BESIDE this
    # repository so the Justfile's default root and the configuration's
    # `module_source_base: ../cs-image-system-3/tfmodules` both resolve):
    # validate, config-drift, the strict state query, the docker-backed
    # modification tests. Reads only; never --no-dry-run. Pushes and the nightly
    # schedule, never pull requests (forks carry no secrets).
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC federation for the read-only cloud roles
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Gate on the live-configuration secrets
        id: gate
        env:
          HAVE_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY != '' }}
          HAVE_TF_VAR_NOS_KEY: ${{ secrets.TF_VAR_NOS_KEY != '' }}
          HAVE_TF_VAR_NOS_SECRET: ${{ secrets.TF_VAR_NOS_SECRET != '' }}
          HAVE_CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY != '' }}
        run: |
          # A secret that is MISSING and one that is EMPTY read the same here ('' either
          # way), so the distinction is made on the SET (stage 43): none configured is an
          # unconfigured repository -- SKIPPED, and said so in the job summary, because a
          # green conclusion is not proof that a step ran; some configured and some not
          # is configured-and-broken -- a FAILURE that names them. Three green jobs once
          # ran nothing because one secret had been set to '' from a checkout missing
          # the file it was read from.
          missing=""; present=0
          for name in AWS_ROLE_ARN GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT OKTA_API_PRIVATE_KEY TF_VAR_NOS_KEY TF_VAR_NOS_SECRET CSIS_CONFIG_IDENTITY; do
            have="HAVE_$name"
            if [ "${!have}" = true ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "live: SKIPPED -- no live-configuration secret is configured, so no step runs (AWS_ROLE_ARN: a federated READ-ONLY AWS role (EC2 describe for the configuration load, read on the state bucket, image and volume describes for the state query); GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT: the read-only GCP identity (the gcloud runtime discovers its network at load); OKTA_API_PRIVATE_KEY / TF_VAR_NOS_KEY / TF_VAR_NOS_SECRET: the Okta triple the Okta workspace asserts at load; CSIS_CONFIG_IDENTITY: the age identity that decrypts the configuration's ENC[age:...] values)"
            { echo "## live: SKIPPED"; echo "No live-configuration secret is configured; no step ran. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "live: FAILED -- secrets are configured but these are missing or EMPTY:$missing (a secret that exists with no value is a failure, not an absence)"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the system
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          path: cs-image-system-3

      - name: Check out the live configuration beside it
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: infrastructurebuilder/cs-image-system-testconfig
          ref: develop
          path: cs-image-system-testconfig

      - name: Federated AWS credentials
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        # The runtimes declare `credentials.profile_name: noaa`. botocore drops
        # the environment credential provider whenever a profile is named
        # explicitly, so the profile itself must carry the federated keys the
        # step above exported (temporary, one hour); the preflight reads a
        # static-key profile as present.
        run: |
          mkdir -p ~/.aws
          printf '[profile noaa]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: Federated GCP credentials
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install just
        if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2

      - name: Install uv
        if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install OpenTofu
        if: steps.gate.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@v1

      - name: Install Packer
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-packer@main

      - name: Place the tools where the configuration's executables.yml pins them
        if: steps.gate.outputs.ready == 'true'
        # cfg/executables.yml names /usr/local/bin/{tofu,packer,gcloud,ansible-playbook,bash,docker}
        run: |
          for tool in tofu packer gcloud ansible-playbook bash docker; do
            [ -x "/usr/local/bin/$tool" ] || { src="$(command -v "$tool" || true)"; [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$tool"; }
          done

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        run: just init

      - name: Mask every encrypted value in this job's log
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cli mask

      - name: Validate the live configuration
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cli validate

      - name: Is the committed emission current with the declarations?
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just config-drift

      - name: Reality matches the records (state query --strict)
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cloud-preflight

      - name: Modification tests under docker
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just test-mods --strict

      - name: Remove the private mirror
        # stage 49: the mirror holds the plaintext of everything the emission
        # carries as ciphertext. Its own step, `if: always()`, so a failed bake
        # or apply never leaves it on a runner that uploads artifacts.
        # always(), so a failed bake or apply never leaves it behind -- but
        # still behind the gate, like every other step in the job
        if: always() && steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        run: just mirror-clean

  perform:
    # `main` records, then PERFORMS on the AWS runtime, then records again.
    #
    # First a FULL dry run commits the complete emission and meta-state and
    # pushes them: the record exists whatever happens next. Then the GCE
    # runtime's emission is compared with the previous record -- GCE stays out
    # of CI by the cost decision, so a declaration change there fails the job
    # loudly rather than bake. Then, under the WRITE role (which trusts `main`
    # alone and carries the bake's EC2 and image actions, Session Manager for
    # the bake's SSH, and read/write on this configuration's state prefix),
    # `just cloud-perform aws-east2-runtime` bakes what is due on that runtime,
    # releases and applies retention there, and commits its meta-state; a scoped
    # run prunes only within its scope (stage 45), so the other runtime's roots
    # stay exactly as committed. A closing full dry run, under the read-only role
    # again, restores the complete emission and records the bake's lineage; it
    # and its push run even when the performing step failed, so a bake that
    # happened is never left unrecorded (an unrecorded image is foreign drift).
    needs: live
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: record-live          # two merges never record or perform at once
      cancel-in-progress: false   # a record in flight is never cancelled
    permissions:
      id-token: write             # OIDC federation for the read-only cloud roles
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Gate on the record secrets and decide the mode
        id: gate
        env:
          HAVE_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY != '' }}
          HAVE_TF_VAR_NOS_KEY: ${{ secrets.TF_VAR_NOS_KEY != '' }}
          HAVE_TF_VAR_NOS_SECRET: ${{ secrets.TF_VAR_NOS_SECRET != '' }}
          HAVE_CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY != '' }}
          HAVE_CSIS_CONFIG_PUSH_TOKEN: ${{ secrets.CSIS_CONFIG_PUSH_TOKEN != '' }}
          IS_RECORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'record') }}
        run: |
          # The same rule as `live` (stage 43): a MISSING secret and an EMPTY one read the
          # same, so none configured is SKIPPED (said in the job summary), some configured
          # is FAILED by name. Recording on `main` needs every one, plus the push token
          # (contents:write on the configuration repository: the run commits, this job
          # pushes) -- there a missing identity is a failure, never a green job that did
          # nothing.
          names="AWS_ROLE_ARN GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT OKTA_API_PRIVATE_KEY TF_VAR_NOS_KEY TF_VAR_NOS_SECRET CSIS_CONFIG_IDENTITY"
          if [ "$IS_RECORD" = true ]; then names="$names CSIS_CONFIG_PUSH_TOKEN"; fi
          missing=""; present=0
          for name in $names; do
            have="HAVE_$name"
            if [ "${!have}" = true ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$IS_RECORD" = true ] && [ -n "$missing" ]; then
            echo "record: FAILED -- recording was requested on main and these secrets are missing or EMPTY:$missing (a secret that exists with no value is a failure, not an absence)"
            exit 1
          elif [ "$present" -eq 0 ]; then
            echo "record: SKIPPED -- no record secret is configured, so no step runs (AWS_ROLE_ARN: a federated READ-ONLY AWS role (EC2 describe for the configuration load, read on the state bucket, image and volume describes for the state query); GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT: the read-only GCP identity (the gcloud runtime discovers its network at load); OKTA_API_PRIVATE_KEY / TF_VAR_NOS_KEY / TF_VAR_NOS_SECRET: the Okta triple the Okta workspace asserts at load; CSIS_CONFIG_IDENTITY: the age identity that decrypts the configuration's ENC[age:...] values; CSIS_CONFIG_PUSH_TOKEN: contents:write on the configuration repository, needed only when recording)"
            { echo "## record: SKIPPED"; echo "No record secret is configured; no step ran. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "record: FAILED -- secrets are configured but these are missing or EMPTY:$missing (a secret that exists with no value is a failure, not an absence)"
            exit 1
          elif [ "$IS_RECORD" = true ]; then
            echo "record: mode RECORD -- the full run commits the emission and meta-state, and they are pushed"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record: mode DRY -- the full run enumerates; nothing is committed, nothing is pushed"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the system
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          path: cs-image-system-3

      - name: Check out the live configuration beside it
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: infrastructurebuilder/cs-image-system-testconfig
          ref: develop
          path: cs-image-system-testconfig
          # actions/checkout persists a credential as an HTTP header that overrides
          # any token in a push URL, so the checkout itself must carry the push
          # credential; the fallback keeps an unconfigured repository cloning.
          token: ${{ secrets.CSIS_CONFIG_PUSH_TOKEN || github.token }}

      - name: Federated AWS credentials
        if: steps.gate.outputs.ready == 'true'
        # the READ-ONLY role: this job writes nothing to any cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.aws
          printf '[profile noaa]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: Federated GCP credentials
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install just
        if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2

      - name: Install uv
        if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install OpenTofu
        if: steps.gate.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@v1

      - name: Install Packer
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-packer@main

      - name: Place the tools where the configuration's executables.yml pins them
        if: steps.gate.outputs.ready == 'true'
        run: |
          for tool in tofu packer gcloud ansible-playbook bash docker; do
            [ -x "/usr/local/bin/$tool" ] || { src="$(command -v "$tool" || true)"; [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$tool"; }
          done

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        run: just init

      - name: Mask every encrypted value in this job's log
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cli mask

      - name: Name the committer for the record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-testconfig
        # The RUN commits into this repository, and a runner has no git identity
        # of its own: without one, `git commit` exits 128 and the run fails after
        # doing all its work. The bot identity keeps a person's address out of the
        # configuration repository's history.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prove write access to the configuration repository
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-testconfig
        # Fail fast: a push credential that is missing, empty or under-scoped must
        # stop the job before the record is written, not after.
        run: |
          git push --dry-run origin HEAD:develop
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: proof

      - name: The full run, recorded
        id: record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        # full and unscoped: any --only filter would make the emission partial and
        # the commit would then delete everything out of scope
        run: just cli run --all --commit

      - name: The full run, not recorded
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record != 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cli run --all

      - name: Push the record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-testconfig
        # the run commits; this job pushes. A non-fast-forward means a person
        # committed while the run was in flight: fail loudly, never force.
        run: |
          git log --oneline -1
          git push origin HEAD:develop

      - name: The GCE runtime stays out of CI, so a change there fails loudly
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        # the GCE emission the record just wrote, against the previous record:
        # a declaration change on the runtime CI must never bake on is a
        # failure here, before anything performs (the record is already pushed).
        # The recipe reads the runtime's emission directories from the
        # configuration, so it loads it: the same environment as the record
        run: just runtime-unchanged gcloud-east1 "${{ steps.proof.outputs.before }}"

      - name: Install what a bake needs on the runner (Session Manager plugin, ansible)
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # the emitted AWS sources reach their build instance through Session
        # Manager (no public IP), which packer drives through this plugin; the
        # ansible provisioner runs ansible-playbook on the runner
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          uv tool install ansible-core
          sudo ln -sf "$HOME/.local/bin/ansible-playbook" /usr/local/bin/ansible-playbook
          session-manager-plugin --version && ansible-playbook --version | head -1

      - name: Federated AWS credentials, the WRITE role
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        # trusts `main` alone; the bake's EC2 and image actions, Session Manager
        # for the bake's SSH, read/write on this configuration's state prefix
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the write credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        run: |
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: The AWS runtime performs
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        # bakes what is due on this runtime, releases, applies retention; the
        # instance roots plan and gate only; commits its meta-state
        run: just cloud-perform aws-east2-runtime

      # The closing steps run after a FAILED performing step, but only once the
      # first record has been made (steps.record): a failure before it -- setup,
      # the committer, the record itself -- has nothing to close and would fail
      # again on the same cause (the first run on main did: the committer had
      # been skipped and the closing commit exited 128).
      - name: Push what the performing run committed
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        working-directory: cs-image-system-testconfig
        run: |
          git log --oneline -1
          git push origin HEAD:develop

      - name: Federated AWS credentials, the read-only role again
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the read-only credentials as the configuration's profile again
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        run: |
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: The full run, recorded again
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        # the complete emission after the scoped run, and the bake's lineage:
        # runs even when the performing step failed, so nothing baked goes unrecorded
        run: just cli run --all --commit

      - name: Push the closing record
        if: always() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true' && steps.record.outcome == 'success'
        working-directory: cs-image-system-testconfig
        run: |
          git log --oneline -1
          git push origin HEAD:develop

      - name: Reality matches the records (state query --strict)
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cloud-preflight

      - name: Remove the private mirror
        # stage 49: the mirror holds the plaintext of everything the emission
        # carries as ciphertext. Its own step, `if: always()`, so a failed bake
        # or apply never leaves it on a runner that uploads artifacts.
        # always(), so a failed bake or apply never leaves it behind -- but
        # still behind the gate, like every other step in the job
        if: always() && steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        run: just mirror-clean

  publish:
    # A pushed `v*` tag publishes the release (stage 41): to TestPyPI always, to
    # PyPI when the tag is not a development version. `just publish` skips every
    # file the index already holds with the same content, so a release the
    # operator published locally with `just release` is checked here, not
    # uploaded twice; one published from CI alone is uploaded here. The tag
    # must name the version in the tree it points at. Each index's token is a
    # repository secret until the package names are stable enough for trusted
    # publishing (one pending publisher per project name).
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the index tokens
        id: gate
        env:
          HAVE_TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN != '' }}
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
          IS_DEV: ${{ contains(github.ref_name, '.dev') }}
        run: |
          # The same rule as the other jobs: none configured is SKIPPED and said in the
          # job summary; a tag that needs a token which is missing or EMPTY is a FAILURE
          # by name. A development tag needs TestPyPI's token alone; a final tag both.
          if [ "$HAVE_TEST_PYPI_TOKEN" != true ] && [ "$HAVE_PYPI_TOKEN" != true ]; then
            echo "publish: SKIPPED -- no index token is configured, so nothing is uploaded (TEST_PYPI_TOKEN: an API token for test.pypi.org; PYPI_TOKEN: one for pypi.org, needed for a final version)"
            { echo "## publish: SKIPPED"; echo "No index token is configured; nothing was uploaded for $GITHUB_REF_NAME. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "pypi=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$HAVE_TEST_PYPI_TOKEN" = true ] || { echo "publish: FAILED -- TEST_PYPI_TOKEN is missing or EMPTY and every version goes to TestPyPI first"; exit 1; }
          if [ "$IS_DEV" = true ]; then
            echo "publish: $GITHUB_REF_NAME is a development version -- TestPyPI alone"
            echo "pypi=false" >> "$GITHUB_OUTPUT"
          else
            [ "$HAVE_PYPI_TOKEN" = true ] || { echo "publish: FAILED -- $GITHUB_REF_NAME is a final version and PYPI_TOKEN is missing or EMPTY"; exit 1; }
            echo "publish: $GITHUB_REF_NAME is a final version -- TestPyPI, then PyPI"
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install just
        if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2

      - name: Install uv
        if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: just init

      - name: The tag names the version in the tree
        if: steps.gate.outputs.ready == 'true'
        run: |
          version=$(uv run --no-sync bump-my-version show current_version)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "publish: FAILED -- the tag is $GITHUB_REF_NAME but the tree says $version"; exit 1; }

      - name: Publish to TestPyPI
        if: steps.gate.outputs.ready == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: just publish test

      - name: Publish to PyPI
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.pypi == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just publish pypi
