name: CI

# Every command is a `just` target, so CI and a developer's shell run the same
# thing. `verify` is the acceptance bar and needs neither
# configuration nor credentials; `core-alone` runs the core's own tests with
# no provider installed, `terraform-alone` the two terraform libraries' own
# tests with nothing but themselves and `docker-alone` the docker family's own
# tests in an environment that holds only that package; `quickstart` runs the
# quickstart page's own commands on a clean machine; `live` proves the system against real clouds
# over the FROZEN FIXTURE, read-only. A pushed `v*` tag is published by its
# own workflow, publish.yml (TestPyPI, by trusted publishing); nothing here
# uploads. The reference configuration (cs-image-system-testconfig) is driven, recorded and
# performed by its OWN workflow, from the release; nothing here reads it. The
# jobs that reach a cloud (`live`) are gated on the secrets the operator
# provides -- until they exist every such leg reports SKIPPED and the job
# passes. The jobs that prove a part alone, and the quickstart, have no
# gate and no condition: they need no secret, and each fails unless its
# tests or steps ran.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * *"        # nightly (UTC): the fixture against the clouds as they are today
  workflow_dispatch:

jobs:
  verify:
    # The bar: lint, type-check (blocking: pyright holds 0 errors)
    # and the fast suite over the frozen fixture. Every push and PR.
    runs-on: ubuntu-24.04
    container:
      # The runner image: AlmaLinux 10 with every tool a job calls at a pinned
      # version (docs/CI_RUNNER.md lists them); moved by `init-config --force` with the
      # release's other lines. The host's docker socket lets the modification tests drive
      # the host daemon through the image's docker client.
      # Unset, CSIS_RUNNER_IMAGE is this release's image and the job logs in to ghcr.io with its own
      # token, as the runner always did (an empty credential is invalid). A team that runs its own
      # build names it in the variable; a registry other than ghcr.io needs the variable
      # CSIS_RUNNER_IMAGE_USERNAME and the secret CSIS_RUNNER_IMAGE_PASSWORD. Release refreshes never
      # touch them.
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v5



      - name: Install dependencies
        run: just init

      - name: Verify
        run: just verify

      - name: Public-safe
        # nothing in the checkout may be material that must never be public
        run: just public-safe

  core-alone:
    # The core proves itself with no provider: the tests of the contract, the
    # kit, the engine, the command line and the always-installed plugins, in an
    # empty environment that holds a plain install with no extras. Every push
    # and PR; no condition, no credentials, no daemon. The recipe fails when no
    # test was collected or any was skipped.
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: just init

      - name: The core alone
        run: just test-core

  terraform-alone:
    # The two shared terraform libraries prove themselves alone: their own
    # tests in an empty environment that holds only the two libraries and what
    # they declare (the kit and the contract), at both ends of the kit range.
    # Every push and PR; no condition, no credentials, no daemon. The recipe
    # fails when no test was collected or any was skipped.
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: just init

      - name: The terraform libraries alone
        run: just test-terraform-alone

  docker-alone:
    # The docker family proves itself alone: its own tests, fixture and golden
    # in an empty environment that holds only the docker package and what it
    # declares, in place and from a copy outside the workspace. Every push and
    # PR; no condition, no credentials, no daemon (its runs are stubbed). The
    # recipe fails when no test was collected or any was skipped, so this job
    # cannot pass without having run them.
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: just init

      - name: The docker family alone
        run: just test-docker-alone

  quickstart:
    # The quickstart page's own commands (docs/QUICKSTART.md, specification 002) on a clean
    # machine: a stock ubuntu:24.04 container, not the runner image, holding the page's
    # prerequisites at exactly the floors it states (`just quickstart-prepare`) and the host's
    # daemon through its socket. The page runs twice against this commit's wheels, with a PATH of
    # those prerequisites and the base system alone (the job's own uv and just are not offered to
    # it), and the recipe names a command that fails, an installed package of the system that did
    # not come from the build, or a first pass over 900 seconds. Every push and PR; no condition and
    # no secret, so this job cannot pass without having run the page. The tag's Publish run runs the
    # page again before its upload (publish.yml).
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Place the tools the job itself runs with (certificates, curl, git; none is the page's)
        # the checkout belongs to the runner's user, not the container's: git trusts it, as the runner image does
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        env:
          UV_PYTHON: "3.13"          # the job's own environment; the page names its Python itself
        run: just init

      - name: The prerequisites at the floors the page states
        run: just quickstart-prepare /opt/quickstart

      - name: The page, twice, on the clean machine
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}   # packer init reads its plugins from GitHub's API
        run: just test-quickstart --passes 2 --page-path /opt/quickstart/bin:/usr/bin:/bin

      - name: The prerequisites table is the code's
        run: just quickstart-table check

  live:
    # The system's live proof over the frozen fixture: the fixture
    # names the real account's networks and project, so
    # with the read-only AWS identity `just fixture-live` validates it online, dry-runs
    # every lifecycle over a private copy (state query off: the fixture's
    # declarations are synthetic) and runs its modification tests under docker.
    # Reads only; never --no-dry-run. Pushes and the nightly schedule, never
    # pull requests (forks carry no secrets).
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      # The runner image: AlmaLinux 10 with every tool a job calls at a pinned
      # version (docs/CI_RUNNER.md lists them); moved by `init-config --force` with the
      # release's other lines. The host's docker socket lets the modification tests drive
      # the host daemon through the image's docker client.
      # Unset, CSIS_RUNNER_IMAGE is this release's image and the job logs in to ghcr.io with its own
      # token, as the runner always did (an empty credential is invalid). A team that runs its own
      # build names it in the variable; a registry other than ghcr.io needs the variable
      # CSIS_RUNNER_IMAGE_USERNAME and the secret CSIS_RUNNER_IMAGE_PASSWORD. Release refreshes never
      # touch them.
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    permissions:
      packages: read          # the runner image is pulled with this job's token: a permissions block without it reads as none
      id-token: write          # OIDC federation for the read-only cloud roles
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Gate on the live secrets
        id: gate
        env:
          HAVE_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          # A secret that is MISSING and one that is EMPTY read the same here ('' either
          # way), so the distinction is made on the SET: none configured is an
          # unconfigured repository -- SKIPPED, and said so in the job summary, because a
          # green conclusion is not proof that a step ran; some configured and some not
          # is configured-and-broken -- a FAILURE that names them. The fixture's age
          # identity is committed beside it, so no identity secret is needed here.
          missing=""; present=0
          for name in AWS_ROLE_ARN; do
            have="HAVE_$name"
            if [ "${!have}" = true ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "live: SKIPPED -- no live secret is configured, so no step runs (AWS_ROLE_ARN: a federated READ-ONLY AWS role (EC2 describe for `validate --online`); the fixture's identity is POSIX and needs no credential)"
            { echo "## live: SKIPPED"; echo "No live secret is configured; no step ran. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "live: FAILED -- secrets are configured but these are missing or EMPTY:$missing (a secret that exists with no value is a failure, not an absence)"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the system
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Federated AWS credentials
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        # The fixture's runtimes declare `credentials.profile_name: noaa`. botocore
        # drops the environment credential provider whenever a profile is named
        # explicitly, so the profile itself must carry the federated keys the
        # step above exported (temporary, one hour).
        run: |
          mkdir -p ~/.aws
          printf '[profile noaa]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials






      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: just init

      - name: The fixture against the clouds
        if: steps.gate.outputs.ready == 'true'
        run: just fixture-live

      - name: The starters that need every provider
        # the Google Cloud family is released from its own repository and is not in this venv:
        # the recipe layers it in from the index; the starters' clouds are stubbed (spec 005, R11)
        if: steps.gate.outputs.ready == 'true'
        run: just test-cloud-starters
