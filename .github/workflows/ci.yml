name: CI

# Every command is a `just` target, so CI and a developer's shell run the same
# thing. Three jobs: `verify` is the acceptance bar and needs neither
# configuration nor credentials; `live` proves the system against real clouds
# over the FROZEN FIXTURE, read-only; `publish` uploads a pushed `v*` tag to
# the index (TestPyPI always, PyPI for a final version). Since stage 64 the
# reference configuration (cs-image-system-testconfig) is driven, recorded and
# performed by its OWN workflow, from the release; nothing here reads it. Each
# job is gated on the secrets the operator provides -- until they exist every
# leg reports SKIPPED and the job passes.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * *"        # nightly (UTC): the fixture against the clouds as they are today
  workflow_dispatch:

jobs:
  verify:
    # The bar: lint, type-check (blocking since pyright reached 0 errors, stage 23)
    # and the fast suite over the frozen fixture (stage 28). Every push and PR.
    runs-on: ubuntu-24.04
    container:
      # The runner image (stage 92): AlmaLinux 10 with every tool a job calls at a pinned
      # version (docs/CI_RUNNER.md lists them); moved by `init-config --force` with the
      # release's other lines. The host's docker socket lets the modification tests drive
      # the host daemon through the image's docker client.
      # Unset, CSIS_RUNNER_IMAGE is this release's image and the job logs in to ghcr.io with its own
      # token, as the runner always did (an empty credential is invalid). A team that runs its own
      # build names it in the variable; a registry other than ghcr.io needs the variable
      # CSIS_RUNNER_IMAGE_USERNAME and the secret CSIS_RUNNER_IMAGE_PASSWORD. Release refreshes never
      # touch them (stage 66).
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v5



      - name: Install dependencies
        run: just init

      - name: Verify
        run: just verify

      - name: Public-safe
        # stage 35: nothing in the checkout may be material that must never be public
        run: just public-safe

  live:
    # The system's live proof over the frozen fixture (stage 64): the fixture
    # names the real account's networks and project and the real OPA team, so
    # with the read-only identities `just fixture-live` validates it, dry-runs
    # every lifecycle over a private copy (state query off: the fixture's
    # declarations are synthetic) and runs its modification tests under docker.
    # Reads only; never --no-dry-run. Pushes and the nightly schedule, never
    # pull requests (forks carry no secrets).
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      # The runner image (stage 92): AlmaLinux 10 with every tool a job calls at a pinned
      # version (docs/CI_RUNNER.md lists them); moved by `init-config --force` with the
      # release's other lines. The host's docker socket lets the modification tests drive
      # the host daemon through the image's docker client.
      # Unset, CSIS_RUNNER_IMAGE is this release's image and the job logs in to ghcr.io with its own
      # token, as the runner always did (an empty credential is invalid). A team that runs its own
      # build names it in the variable; a registry other than ghcr.io needs the variable
      # CSIS_RUNNER_IMAGE_USERNAME and the secret CSIS_RUNNER_IMAGE_PASSWORD. Release refreshes never
      # touch them (stage 66).
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    permissions:
      packages: read          # the runner image is pulled with this job's token (stage 92): a permissions block without it reads as none
      id-token: write          # OIDC federation for the read-only cloud roles
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Gate on the live secrets
        id: gate
        env:
          HAVE_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY != '' }}
          HAVE_TF_VAR_NOS_KEY: ${{ secrets.TF_VAR_NOS_KEY != '' }}
          HAVE_TF_VAR_NOS_SECRET: ${{ secrets.TF_VAR_NOS_SECRET != '' }}
        run: |
          # A secret that is MISSING and one that is EMPTY read the same here ('' either
          # way), so the distinction is made on the SET (stage 43): none configured is an
          # unconfigured repository -- SKIPPED, and said so in the job summary, because a
          # green conclusion is not proof that a step ran; some configured and some not
          # is configured-and-broken -- a FAILURE that names them. The fixture's age
          # identity is committed beside it, so no identity secret is needed here.
          missing=""; present=0
          for name in AWS_ROLE_ARN GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT OKTA_API_PRIVATE_KEY TF_VAR_NOS_KEY TF_VAR_NOS_SECRET; do
            have="HAVE_$name"
            if [ "${!have}" = true ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "live: SKIPPED -- no live secret is configured, so no step runs (AWS_ROLE_ARN: a federated READ-ONLY AWS role (EC2 describe for the configuration load); GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT: the read-only GCP identity (the gcloud runtime discovers its network at load); OKTA_API_PRIVATE_KEY / TF_VAR_NOS_KEY / TF_VAR_NOS_SECRET: the Okta triple the Okta workspace asserts at load)"
            { echo "## live: SKIPPED"; echo "No live secret is configured; no step ran. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "live: FAILED -- secrets are configured but these are missing or EMPTY:$missing (a secret that exists with no value is a failure, not an absence)"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the system
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Federated AWS credentials
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        # The fixture's runtimes declare `credentials.profile_name: noaa`. botocore
        # drops the environment credential provider whenever a profile is named
        # explicitly, so the profile itself must carry the federated keys the
        # step above exported (temporary, one hour).
        run: |
          mkdir -p ~/.aws
          printf '[profile noaa]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: Federated GCP credentials
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}






      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: just init

      - name: The fixture against the clouds
        if: steps.gate.outputs.ready == 'true'
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
        run: just fixture-live

  publish:
    # A pushed `v*` tag publishes the release (stage 41): to TestPyPI always, to
    # PyPI when the tag is not a development version. `just publish` skips every
    # file the index already holds with the same content, so a release the
    # operator published locally with `just release` is checked here, not
    # uploaded twice; one published from CI alone is uploaded here. The tag
    # must name the version in the tree it points at. Each index's token is a
    # repository secret until the package names are stable enough for trusted
    # publishing (one pending publisher per project name).
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container:
      # The runner image (stage 92): AlmaLinux 10 with every tool a job calls at a pinned
      # version (docs/CI_RUNNER.md lists them); moved by `init-config --force` with the
      # release's other lines. The host's docker socket lets the modification tests drive
      # the host daemon through the image's docker client.
      # Unset, CSIS_RUNNER_IMAGE is this release's image and the job logs in to ghcr.io with its own
      # token, as the runner always did (an empty credential is invalid). A team that runs its own
      # build names it in the variable; a registry other than ghcr.io needs the variable
      # CSIS_RUNNER_IMAGE_USERNAME and the secret CSIS_RUNNER_IMAGE_PASSWORD. Release refreshes never
      # touch them (stage 66).
      image: ${{ vars.CSIS_RUNNER_IMAGE || 'ghcr.io/infrastructurebuilder/csis-ci:alma10-20261016.4' }}
      credentials:
        username: ${{ vars.CSIS_RUNNER_IMAGE_USERNAME || github.actor }}
        password: ${{ secrets.CSIS_RUNNER_IMAGE_PASSWORD || github.token }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Gate on the index tokens
        id: gate
        env:
          HAVE_TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN != '' }}
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
          HAVE_STARTER_PUSH_TOKEN: ${{ secrets.STARTER_PUSH_TOKEN != '' }}
          IS_DEV: ${{ contains(github.ref_name, '.dev') }}
        run: |
          # The same rule as the other jobs: none configured is SKIPPED and said in the
          # job summary; a tag that needs a token which is missing or EMPTY is a FAILURE
          # by name. A development tag needs TestPyPI's token alone; a final tag both.
          if [ "$HAVE_TEST_PYPI_TOKEN" != true ] && [ "$HAVE_PYPI_TOKEN" != true ]; then
            echo "publish: SKIPPED -- no index token is configured, so nothing is uploaded (TEST_PYPI_TOKEN: an API token for test.pypi.org; PYPI_TOKEN: one for pypi.org, needed for a final version)"
            { echo "## publish: SKIPPED"; echo "No index token is configured; nothing was uploaded for $GITHUB_REF_NAME. A green conclusion here is not proof that anything ran."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "pypi=false" >> "$GITHUB_OUTPUT"; echo "starters=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$HAVE_TEST_PYPI_TOKEN" = true ] || { echo "publish: FAILED -- TEST_PYPI_TOKEN is missing or EMPTY and every version goes to TestPyPI first"; exit 1; }
          if [ "$IS_DEV" = true ]; then
            echo "publish: $GITHUB_REF_NAME is a development version -- TestPyPI alone"
            echo "pypi=false" >> "$GITHUB_OUTPUT"; echo "starters=false" >> "$GITHUB_OUTPUT"
          else
            [ "$HAVE_PYPI_TOKEN" = true ] || { echo "publish: FAILED -- $GITHUB_REF_NAME is a final version and PYPI_TOKEN is missing or EMPTY"; exit 1; }
            echo "publish: $GITHUB_REF_NAME is a final version -- TestPyPI, then PyPI"
            echo "pypi=true" >> "$GITHUB_OUTPUT"
            # stage 66: then the template repositories, which need their own token
            if [ "$HAVE_STARTER_PUSH_TOKEN" = true ]; then
              echo "starters=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish: the template repositories are SKIPPED -- STARTER_PUSH_TOKEN is not configured"
              { echo "## publish-starters: SKIPPED"; echo "STARTER_PUSH_TOKEN is not configured; the template repositories were not published for $GITHUB_REF_NAME."; } >> "$GITHUB_STEP_SUMMARY"
              echo "starters=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5



      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: just init

      - name: The tag names the version in the tree
        if: steps.gate.outputs.ready == 'true'
        run: |
          version=$(uv run --no-sync bump-my-version show current_version)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "publish: FAILED -- the tag is $GITHUB_REF_NAME but the tree says $version"; exit 1; }

      - name: Publish to TestPyPI
        if: steps.gate.outputs.ready == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: just publish test

      - name: Publish to PyPI
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.pypi == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just publish pypi

      - name: Publish the template repositories
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.pypi == 'true' && steps.gate.outputs.starters == 'true'
        env:
          STARTER_PUSH_TOKEN: ${{ secrets.STARTER_PUSH_TOKEN }}
        run: just publish-starters
