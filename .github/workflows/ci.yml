name: CI

# Every command is a `just` target, so CI and a developer's shell run the same
# thing. Three jobs: `verify` is the acceptance bar and needs neither
# configuration nor credentials; `live` drives the live configuration read-only;
# `record` runs the full configuration on `main` and commits what it emits.
# No job performs a cloud change: none holds a write-capable cloud credential.
# Each is gated on the secrets the operator provides -- until they exist every
# leg reports SKIPPED and the job passes.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * *"        # nightly (UTC): drift and the strict state query on the live configuration
  workflow_dispatch:
    inputs:
      mode:
        description: "dry enumerates the run; record commits and pushes it (honoured only on main)"
        type: choice
        options: [dry, record]
        default: dry

jobs:
  verify:
    # The bar: lint, type-check (blocking since pyright reached 0 errors, stage 23)
    # and the fast suite over the frozen fixture (stage 28). Every push and PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: just init

      - name: Verify
        run: just verify

      - name: Public-safe
        # stage 35: nothing in the checkout may be material that must never be public
        run: just public-safe

  live:
    # The live configuration (cs-image-system-testconfig, checked out BESIDE this
    # repository so the Justfile's default root and the configuration's
    # `module_source_base: ../cs-image-system-3/tfmodules` both resolve):
    # validate, config-drift, the strict state query, the docker-backed
    # modification tests. Reads only; never --no-dry-run. Pushes and the nightly
    # schedule, never pull requests (forks carry no secrets).
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC federation for the read-only cloud roles
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Gate on the live-configuration secrets
        id: gate
        env:
          HAVE_AWS: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA: ${{ secrets.OKTA_API_PRIVATE_KEY != '' && secrets.TF_VAR_NOS_KEY != '' && secrets.TF_VAR_NOS_SECRET != '' }}
          HAVE_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY != '' }}
        run: |
          ready=true
          [ "$HAVE_AWS" = true ]    || { echo "live: SKIPPED -- no AWS_ROLE_ARN (a federated READ-ONLY role: EC2 describe for the configuration load, read on the state bucket, image and volume describes for the state query)"; ready=false; }
          [ "$HAVE_GCP" = true ]    || { echo "live: SKIPPED -- no GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT (the gcloud runtime discovers its network at load; read-only)"; ready=false; }
          [ "$HAVE_OKTA" = true ]   || { echo "live: SKIPPED -- no OKTA_API_PRIVATE_KEY / TF_VAR_NOS_KEY / TF_VAR_NOS_SECRET (the Okta workspace asserts them at load)"; ready=false; }
          [ "$HAVE_IDENTITY" = true ] || { echo "live: SKIPPED -- no CSIS_CONFIG_IDENTITY (the age identity that decrypts the configuration's ENC[age:...] values, stage 33)"; ready=false; }
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Check out the system
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          path: cs-image-system-3

      - name: Check out the live configuration beside it
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: infrastructurebuilder/cs-image-system-testconfig
          ref: develop
          path: cs-image-system-testconfig

      - name: Federated AWS credentials
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        # The runtimes declare `credentials.profile_name: noaa`. botocore drops
        # the environment credential provider whenever a profile is named
        # explicitly, so the profile itself must carry the federated keys the
        # step above exported (temporary, one hour); the preflight reads a
        # static-key profile as present.
        run: |
          mkdir -p ~/.aws
          printf '[profile noaa]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: Federated GCP credentials
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install just
        if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2

      - name: Install uv
        if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install OpenTofu
        if: steps.gate.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@v1

      - name: Install Packer
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-packer@main

      - name: Place the tools where the configuration's executables.yml pins them
        if: steps.gate.outputs.ready == 'true'
        # cfg/executables.yml names /usr/local/bin/{tofu,packer,gcloud,ansible-playbook,bash,docker}
        run: |
          for tool in tofu packer gcloud ansible-playbook bash docker; do
            [ -x "/usr/local/bin/$tool" ] || { src="$(command -v "$tool" || true)"; [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$tool"; }
          done

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        run: just init

      - name: Validate the live configuration
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cli validate

      - name: Is the committed emission current with the declarations?
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just config-drift

      - name: Reality matches the records (state query --strict)
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cloud-preflight

      - name: Modification tests under docker
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just test-mods --strict

  record:
    # `main` records. A FULL, unscoped run that commits the emission and
    # meta-state into the configuration repository, and pushes them.
    #
    # It performs nothing: no bake, no apply. Two facts force that. Only a full
    # run keeps the emission complete -- any `--only` filter makes generation
    # partial and the commit then stages the deletion of everything out of scope
    # (a scoped run drops 23 to 37 committed files). And a full REAL run would
    # bake whatever fingerprint changed, including on the GCE runtime, which this
    # job has no identity to write to. So the job that keeps the record true
    # carries no write-capable credential at all: the same READ-ONLY AWS role and
    # GCP service account the live job uses, plus a token that can push the
    # configuration repository. Performing on `main` is a later stage, and needs
    # generation to stop pruning out-of-scope emission first.
    needs: live
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: record-live          # two merges never write one record at once
      cancel-in-progress: false   # a record in flight is never cancelled
    permissions:
      id-token: write             # OIDC federation for the read-only cloud roles
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Gate on the record secrets and decide the mode
        id: gate
        env:
          HAVE_AWS: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAVE_GCP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAVE_OKTA: ${{ secrets.OKTA_API_PRIVATE_KEY != '' && secrets.TF_VAR_NOS_KEY != '' && secrets.TF_VAR_NOS_SECRET != '' }}
          HAVE_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY != '' }}
          HAVE_PUSH: ${{ secrets.CSIS_CONFIG_PUSH_TOKEN != '' }}
          IS_RECORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'record') }}
        run: |
          ready=true
          [ "$HAVE_AWS" = true ]      || { echo "record: SKIPPED -- no AWS_ROLE_ARN (the READ-ONLY role the configuration load needs)"; ready=false; }
          [ "$HAVE_GCP" = true ]      || { echo "record: SKIPPED -- no GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT (READ-ONLY; the gcloud runtime discovers its network at load)"; ready=false; }
          [ "$HAVE_OKTA" = true ]     || { echo "record: SKIPPED -- no OKTA_API_PRIVATE_KEY / TF_VAR_NOS_KEY / TF_VAR_NOS_SECRET (the Okta workspace asserts them at load)"; ready=false; }
          [ "$HAVE_IDENTITY" = true ] || { echo "record: SKIPPED -- no CSIS_CONFIG_IDENTITY (the age identity that decrypts the configuration's ENC[age:...] values)"; ready=false; }
          if [ "$IS_RECORD" = true ]; then
            [ "$HAVE_PUSH" = true ] || { echo "record: SKIPPED -- no CSIS_CONFIG_PUSH_TOKEN (contents:write on the configuration repository; the run commits, this job pushes)"; ready=false; }
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          # A dispatch or an unconfigured repository may skip and pass. Recording
          # on `main` may NOT: a missing identity there is a failure, not a green
          # job that did nothing.
          if [ "$IS_RECORD" = true ] && [ "$ready" != true ]; then
            echo "record: recording was requested on main and an identity is missing (see above); failing rather than passing silently"
            exit 1
          fi
          if [ "$IS_RECORD" = true ]; then
            echo "record: mode RECORD -- the full run commits the emission and meta-state, and they are pushed"
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record: mode DRY -- the full run enumerates; nothing is committed, nothing is pushed"
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the system
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          path: cs-image-system-3

      - name: Check out the live configuration beside it
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: infrastructurebuilder/cs-image-system-testconfig
          ref: develop
          path: cs-image-system-testconfig
          # actions/checkout persists a credential as an HTTP header that overrides
          # any token in a push URL, so the checkout itself must carry the push
          # credential; the fallback keeps an unconfigured repository cloning.
          token: ${{ secrets.CSIS_CONFIG_PUSH_TOKEN || github.token }}

      - name: Federated AWS credentials
        if: steps.gate.outputs.ready == 'true'
        # the READ-ONLY role: this job writes nothing to any cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Name the federated credentials as the configuration's profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.aws
          printf '[profile noaa]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          printf '[noaa]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: Federated GCP credentials
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install just
        if: steps.gate.outputs.ready == 'true'
        uses: extractions/setup-just@v2

      - name: Install uv
        if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install OpenTofu
        if: steps.gate.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@v1

      - name: Install Packer
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-packer@main

      - name: Place the tools where the configuration's executables.yml pins them
        if: steps.gate.outputs.ready == 'true'
        run: |
          for tool in tofu packer gcloud ansible-playbook bash docker; do
            [ -x "/usr/local/bin/$tool" ] || { src="$(command -v "$tool" || true)"; [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$tool"; }
          done

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        run: just init

      - name: Name the committer for the record
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-testconfig
        # The RUN commits into this repository, and a runner has no git identity
        # of its own: without one, `git commit` exits 128 and the run fails after
        # doing all its work. The bot identity keeps a person's address out of the
        # configuration repository's history.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prove write access to the configuration repository
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-testconfig
        # Fail fast: a push credential that is missing, empty or under-scoped must
        # stop the job before the record is written, not after.
        run: git push --dry-run origin HEAD:develop

      - name: The full run, recorded
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        # full and unscoped: any --only filter would make the emission partial and
        # the commit would then delete everything out of scope
        run: just cli run --all --commit

      - name: The full run, not recorded
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record != 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cli run --all

      - name: Push what the run committed
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.record == 'true'
        working-directory: cs-image-system-testconfig
        # the run commits; this job pushes. A non-fast-forward means a person
        # committed while the run was in flight: fail loudly, never force.
        run: |
          git log --oneline -1
          git push origin HEAD:develop

      - name: Reality matches the records (state query --strict)
        if: steps.gate.outputs.ready == 'true'
        working-directory: cs-image-system-3
        env:
          OKTA_API_PRIVATE_KEY: ${{ secrets.OKTA_API_PRIVATE_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_key: ${{ secrets.TF_VAR_NOS_KEY }}
          TF_VAR_nos_coastal_modeling_cloud_sandbox_secret: ${{ secrets.TF_VAR_NOS_SECRET }}
          CSIS_CONFIG_IDENTITY: ${{ secrets.CSIS_CONFIG_IDENTITY }}
        run: just cloud-preflight
