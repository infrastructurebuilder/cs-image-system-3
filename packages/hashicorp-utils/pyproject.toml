[project]
name = "cs-image-system-hashicorp-utils"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
"cs-image-system-system",
"cs-image-system-base",
"packaging",
"python-hcl2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
