[project]
name = "cs-image-system-hashicorp-utils"
version = "0.2.0"
description = "A library, not a plugin, on nothing but the contract: HCL rendering and the per-run terraform and packer collectors for the plugins that emit OpenTofu roots and Packer templates"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.5,<0.6",
    "packaging>=26.2",
    "pydantic>=2.13",
    "python-hcl2>=8.1",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/hashicorp-utils/README.md"

# this library is one of the SDK's: it declares itself, and the kit's check reads its declared surface from
# the module named here (the kit names no library of the SDK but itself)
[project.entry-points."cs_image_system.sdk"]
"cs_image_system.hashicorp_utils" = "cs_image_system.hashicorp_utils.surface"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]

# The library's own suite runs from this directory alone (`just test-terraform-alone` does so in an
# environment holding only the two terraform libraries and what they declare).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
