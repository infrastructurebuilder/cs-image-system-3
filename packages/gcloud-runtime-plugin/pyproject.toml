[project]
name = "cs-image-system-gcloud-runtime-plugin"
version = "0.1.1.dev2"
description = "The gcloud runtime type: Google Compute Engine as a place where images bake and instances run"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-system==0.1.1.dev2",
    "cs-image-system-hashicorp-utils==0.1.1.dev2",
    "google-cloud-compute>=1.49",
    "google-api-core>=2.31",
    "google-auth>=2.55",
    "python-hcl2>=8.1",
    "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/gcloud-runtime-plugin/README.md"

[project.entry-points."cs_image_system.plugins.runtime"]
gcloud = "cs_image_system.gcloud_runtime.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
