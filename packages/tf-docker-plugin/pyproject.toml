[project]
name = "cs-image-system-tf-docker-plugin"
version = "0.1.9"
description = "The OpenTofu plugin for a container runtime: containers and volumes on a Docker Engine API daemon as module calls"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.4,<0.5",
    "cs-image-system-base==0.1.9",
    "cs-image-system-hashicorp-utils==0.1.9",
    "cs-image-system-tofu-roots==0.1.9",
    "cs-image-system-docker-runtime-plugin==0.1.9",
    "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/tf-docker-plugin/README.md"

[project.entry-points."cs_image_system.plugins.instance"]
tf-docker-plugin = "cs_image_system.tf_docker_plugin.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
