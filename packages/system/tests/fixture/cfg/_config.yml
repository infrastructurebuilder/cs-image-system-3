# The core's own fixture: the configuration's own settings.
# It declares no provider: its one runtime is the test kit's test-double
# (cs_image_system.system.testing.double), which exists only inside a test run.
id: cs-image-core-test
generation_directory: ./generated/
sleep_before_finalization: 30
# Every ENC[age:...] value is encrypted to this recipient; the fixture's
# identity (.age-identity, a TEST key) opens it in the suite
encryption:
  recipients:
    - age1hl95vsankapyxyyejhdejmywuwc4ddvpjmflj0hf0y8xjtuk3vystd9ang
public_safe:
  allow:
    - "path:.age-identity"           # the fixture's TEST identity, committed on purpose
gitignore:
  - ".*"
  - "!.terraform.lock.hcl"
  - "!.gitignore"
  - "**/target/"
dateformat: "%Y%m%d_%H%M%S"
config:
  use_state_backends: true
  apply_instances: false
  apply_storage: false
  apply_identity: false
  module_source_base: ../tfmodules
  systemuser: "{{ ENV.USER }}"
  # the mandatory local admin user's PUBLIC keys, encrypted to prove the path:
  # the emission carries the ciphertext
  admin_public_keys:
    - ENC[age:]
