[project]
name = "cs-image-system-system"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "typer[all]",
    "cs-image-system-base"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]

[project.scripts]
cs-image-system = "cs_image_system.system.cli:app"
