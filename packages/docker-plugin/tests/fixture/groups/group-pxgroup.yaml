# The docker family's own fixture: the one group, a POSIX group, and so the tree's root group.
# Taken from the repository's shared fixture (tests/fixtures/config) with its
# names unchanged, so the family's golden and the shared golden pin the same
# docker emission.
groups:
- name: pxgroup
  type: posix-local
  gid: 3101
  description: '{{ group.name }} group'
  members:
  - taylor_tango
  - unity_uniform
  admins:
  - taylor_tango
  is_root: true
