# The docker family's own fixture: the one instance builder.
# Taken from the repository's shared fixture (tests/fixtures/config) with its
# names unchanged, so the family's golden and the shared golden pin the same
# docker emission.
instance_builders:
- name: tofu-docker
  type: tofu-docker
  runtime: docker-fixture
  executable: open-tofu-1
  required_plugins:
  - name: docker
    source: kreuzwerker/docker
    version: '>= 3.0.0'
  is_default: true
