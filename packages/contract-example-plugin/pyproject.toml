[project]
name = "cs-image-system-contract-example-plugin"
version = "0.1.4"
description = "The proof of the plugin contract: the inmem state backend, a plugin written against cs-image-system-contract alone, with nothing from the core"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Stage 30: the contract and nothing else of the system. A test holds this
# package to importing nothing from cs_image_system.base, .system or
# .hashicorp_utils; the workspace pins the contract at == because the
# packages release together, an external plugin would pin a floor.
dependencies = [
    "cs-image-system-contract==0.1.4",
    "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/contract-example-plugin/README.md"

[project.entry-points."cs_image_system.plugins.state"]
contract_example_plugin = "cs_image_system.contract_example_plugin.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
