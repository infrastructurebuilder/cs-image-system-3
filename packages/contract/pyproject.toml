[project]
name = "cs-image-system-contract"
version = "0.1.3"
description = "The plugin contract of cs-image-system: the protocols, constants and data carriers a plugin is written against, with no dependency on the core"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Stage 30: the contract is upstream of the core. It depends on no sibling
# package -- `base` depends on it, never the reverse -- and on exactly the two
# third-party distributions its sources import.
dependencies = [
    "packaging>=26.2",
    "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/contract/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
