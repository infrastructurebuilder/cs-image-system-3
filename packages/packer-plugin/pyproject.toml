[project]
name = "cs-image-system-packer-plugin"
version = "0.1.0"
description = "The image builders for HashiCorp Packer: amazon-ebs and googlecompute roots from base and instance images"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-system==0.1.0",
    "cs-image-system-aws-runtime-plugin==0.1.0",
    "cs-image-system-hashicorp-utils==0.1.0",
    "Jinja2>=3.1",
    "python-hcl2>=8.1",
    "pydantic>=2.13",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/packer-plugin/README.md"

[project.entry-points."cs_image_system.plugins.image"]
packer_plugin = "cs_image_system.packer_plugin.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
