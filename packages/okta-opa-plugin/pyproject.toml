[project]
name = "cs-image-system-okta-opa-plugin"
version = "0.1.7.dev2"
description = "The identity plugin for Okta: groups and users as Okta Privileged Access and Okta terraform roots"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.4,<0.5",
    "cs-image-system-base==0.1.7.dev2",
    "cs-image-system-hashicorp-utils==0.1.7.dev2",
    "cs-image-system-tofu-roots==0.1.7.dev2",
    "pydantic>=2.13",
    "cryptography>=49.0",   # stage 70 step 6: the Okta services app check signs a private-key JWT
    "typer>=0.26",          # the plugin's own commands (`workload`, `verify login`)
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/okta-opa-plugin/README.md"

[project.entry-points."cs_image_system.plugins.group"]
okta_opa_plugin = "cs_image_system.okta_opa_plugin.main:initialize"

# stage 70 step 6: the Okta and OPA section of the bootstrap interview
[project.entry-points."cs_image_system.bootstrap"]
okta = "cs_image_system.okta_opa_plugin.bootstrap:okta_section"

# the commands only this plugin can drive: `workload` (describe, token, probe)
# and `verify login`, mounted by the system's console script when installed
[project.entry-points."cs_image_system.commands"]
okta_opa_plugin = "cs_image_system.okta_opa_plugin.cli:command_mounts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]

# the terraform modules this package ships, as package data (the group is the
# contract's MODULES_ENTRY_POINT_GROUP; the value is <package>:<dirname>)
[project.entry-points."cs_image_system.modules"]
modules = "cs_image_system.okta_opa_plugin:tfmodules"
