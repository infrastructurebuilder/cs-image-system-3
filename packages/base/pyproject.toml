[project]
name = "cs-image-system-base"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "Jinja2",
    "PyYAML",
    "cattrs",
    "multipledispatch",
    "age",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]

[project.entry-points."cs_image_system.plugins.base"]
base_plugin = "cs_image_system.base.init:initialize"
