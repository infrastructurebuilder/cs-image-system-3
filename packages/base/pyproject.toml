[project]
name = "cs-image-system-base"
version = "0.1.0"
description = "The core library of cs-image-system: the configuration models, the plugin contract, the lifecycle runner, meta-state and the rules"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "age>=0.5",
    "packaging>=26.2",
    "pydantic>=2.13",
    "typer>=0.26",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/base/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]

[project.entry-points."cs_image_system.plugins.base"]
base_plugin = "cs_image_system.base.init:initialize"
