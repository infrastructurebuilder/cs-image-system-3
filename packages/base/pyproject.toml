[project]
name = "cs-image-system-base"
version = "0.2.0"
description = "The kit of cs-image-system: the base classes, the models, the registry and the run context a plugin is written against"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.4,<0.5",
    "PyYAML>=6.0",
    "age>=0.5",
    "packaging>=26.2",
    "pydantic>=2.13",
    "typer>=0.26",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/base/README.md"

# this library is one of the SDK's: it declares itself, and the kit's check reads its declared surface from
# the module named here (the kit names no library of the SDK but itself)
[project.entry-points."cs_image_system.sdk"]
"cs_image_system.base" = "cs_image_system.base.surface"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]

[project.entry-points."cs_image_system.plugins.base"]
base_plugin = "cs_image_system.engine.init:initialize"

# the terraform modules this package ships, as package data (the group is the
# contract's MODULES_ENTRY_POINT_GROUP; the value is <package>:<dirname>)
[project.entry-points."cs_image_system.modules"]
modules = "cs_image_system.base:tfmodules"
