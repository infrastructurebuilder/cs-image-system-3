# The aws runtime's part of the release-owned image-source catalog: where
# a vendor image comes from on EC2, per family, in the SYSTEM's query
# vocabulary (CONFIGURATION.md section 5a). The core merges this with
# every other installed runtime's part by family; a tree's own
# `cfg/image-sources*.yml` extends or overrides the result by family (and
# version); an OS builder's own `query`, and its runtime entry's, land on
# top of the block, key by key.
#
# `{version}` is the one placeholder: the OS builder's `family_version`.
# Every publisher id here is a vendor fact, reviewed at the release that
# ships it; a tree that distrusts one overrides it.
image_sources:
  # ------------------------------------------------ the Red Hat family
  - family: rhel
    description: Red Hat Enterprise Linux, the vendor's own images
    sources:
      aws:
        publisher: ["309956199498"]        # Red Hat's public AMI publishing account
        name: "RHEL-{version}*x86_64*"
        root_device: ebs
        virtualization: hvm
  - family: alma-linux
    is: rhel
    description: AlmaLinux, a RHEL rebuild
    sources:
      aws:
        publisher: ["764336703387"]        # the AlmaLinux OS Foundation's public AMI publishing account
        name: "AlmaLinux OS {version}*x86_64*"
        root_device: ebs
        virtualization: hvm
  - family: rocky-linux
    is: rhel
    description: Rocky Linux, a RHEL rebuild
    sources:
      aws:
        publisher: ["792107900819"]        # the Rocky Enterprise Software Foundation's public AMI publishing account
        name: "Rocky-{version}-EC2-Base*x86_64*"
        root_device: ebs
        virtualization: hvm
  # centos-stream: no public AMI publisher is declared here; a tree that
  # bakes it on EC2 declares its own block.
  - family: fedora
    description: Fedora Cloud
    sources:
      aws:
        publisher: ["125523088429"]        # the Fedora Project's public AMI publishing account
        name: "Fedora-Cloud-Base*{version}*x86_64*"
        root_device: ebs
        virtualization: hvm
  # ------------------------------------------------ the Debian family
  - family: debian
    description: Debian, the vendor's own cloud images
    sources:
      aws:
        publisher: ["136693071363"]        # Debian's public AMI publishing account
        name: "debian-{version}-amd64-*"
        root_device: ebs
  - family: ubuntu
    description: Ubuntu
    sources:
      aws:
        publisher: ["099720109477"]        # Canonical's public AMI publishing account
        name: "ubuntu/images/hvm-ssd*/ubuntu-*-{version}*-amd64-server-*"
        root_device: ebs
