[project]
name = "cs-image-system-tofu-roots"
version = "0.2.0"
description = "The provider-neutral terraform roots: the root mixin and the instance and storage root bases every OpenTofu root plugin subclasses"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.4,<0.5",
    # the kit, by range: this library is written against the kit's declared surface, as a provider is, and is
    # proven alone at both ends of the range (`just test-terraform-alone`); its sibling on the same version
    # line stays exact
    "cs-image-system-base>=0.2,<0.3",
    "cs-image-system-hashicorp-utils==0.2.0",
    "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/tofu-roots/README.md"

[project.entry-points."cs_image_system.plugins.hooks"]
tofu_roots = "cs_image_system.tofu_roots.hooks:initialize"

# this library is one of the SDK's: it declares itself, and the kit's check reads its declared surface from
# the module named here (the kit names no library of the SDK but itself)
[project.entry-points."cs_image_system.sdk"]
"cs_image_system.tofu_roots" = "cs_image_system.tofu_roots.surface"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]

# The library's own suite runs from this directory alone (`just test-terraform-alone` does so in an
# environment holding only the two terraform libraries and what they declare).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
