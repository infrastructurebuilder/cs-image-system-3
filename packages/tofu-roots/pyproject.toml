[project]
name = "cs-image-system-tofu-roots"
version = "0.1.8"
description = "The provider-neutral terraform roots: the root mixin and the instance and storage root bases every OpenTofu root plugin subclasses"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.4,<0.5",
    "cs-image-system-base==0.1.8",
    "cs-image-system-hashicorp-utils==0.1.8",
    "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/packages/tofu-roots/README.md"

[project.entry-points."cs_image_system.plugins.hooks"]
tofu_roots = "cs_image_system.tofu_roots.hooks:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
