[project]
name = "cs-image-system-tf-s3-state-plugin"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
"cs-image-system-system",
"cs-image-system-hashicorp-utils",
]

[project.entry-points."cs_image_system.plugins.state"]
tf_s3_state_plugin = "cs_image_system.tf_s3_state_plugin.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
