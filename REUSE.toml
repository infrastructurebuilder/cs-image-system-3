# REUSE (https://reuse.software) declarations for the files that carry no header of
# their own: the frozen fixture and a package's own fixture and golden (modification
# files are content-hashed into image lineage and a golden must equal the emission
# byte for byte), prose, the lock file,
# JSON and marker files. Every other source file carries the SPDX two-liner; `just
# headers` adds it to a new file and `just lint` runs `reuse lint`.
version = 1

[[annotations]]
path = [
  "tests/fixtures/**",
  "packages/*/tests/fixture/**",
  "packages/*/tests/golden/**",
  "docs/**",
  "**/*.md",
  "uv.lock",
  ".gitignore",
  "**/*.json",
  "*.code-workspace",
  "**/py.typed",
  "ci/runner-image/TAG",
  ".claude/**",
  ".devcontainer/**",
  ".vscode/**",
  "ATTIC/**",
  "specs/**",
  ".specify/memory/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mykel Alvis <mykelalvis@infrastructurebuilder.org>"
SPDX-License-Identifier = "Apache-2.0"

# Spec Kit's own files, as `specify init` wrote them: its scripts, templates and
# workflow under .specify/ and its skills under .claude/skills/. They are GitHub's,
# under the MIT licence. The constitution (.specify/memory/) is this project's, above.
[[annotations]]
path = [
  ".specify/.gitignore",
  ".specify/*.json",
  ".specify/integrations/**",
  ".specify/scripts/**",
  ".specify/templates/**",
  ".specify/workflows/**",
  ".claude/skills/speckit-*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"
