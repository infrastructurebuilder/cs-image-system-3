[project]
name = "cs-image-system"
version = "0.1.7.dev2"
description = "Declarative provisioning of identities, storages, base images and instance images on AWS, GCE and docker, from one YAML tree through gates: the core in one install, each provider as an extra"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# The umbrella: its one module is src/cs_image_system/extras.py, the table from a `type:`
# word to the extra that installs its plugin (the core names no provider, so the table is
# the umbrella's and the core reads it through the entry point below). Its dependencies are the core --
# the CLI, the engine, the libraries and every plugin that needs no provider account --
# pinned at == its own version; each provider is an extra below, and a bare install carries
# no runtime (`validate` names the extra a tree's `type:` words need, base/extras.py).
# The contract has a version of its own and is pinned to its compatible series.
dependencies = [
    "cs-image-system-ansible-plugin==0.1.7.dev2",
    "cs-image-system-base==0.1.7.dev2",
    "cs-image-system-bash-mod-plugin==0.1.7.dev2",
    "cs-image-system-default-os-plugin==0.1.7.dev2",
    "cs-image-system-contract>=0.4,<0.5",
    "cs-image-system-hashicorp-utils==0.1.7.dev2",
    "cs-image-system-local-state-plugin==0.1.7.dev2",
    "cs-image-system-packer-plugin==0.1.7.dev2",
    "cs-image-system-posix-identity-plugin==0.1.7.dev2",
    "cs-image-system-system==0.1.7.dev2",
    "cs-image-system-tofu-roots==0.1.7.dev2",
]

# The extras: a provider's runtime plugin with its terraform-root and state-backend
# plugins, and `all` for every provider. Every pin is == the workspace version, so a bump moves
# them with the rest (the `=={current_version}"` rule below reads the whole file). The two
# private plugins (dummy, contract-example) are in the dev group, never here.
[project.optional-dependencies]
aws = [
    "cs-image-system-aws-runtime-plugin==0.1.7.dev2",
    "cs-image-system-tf-ebs-instance-plugin==0.1.7.dev2",
    "cs-image-system-tf-s3-state-plugin==0.1.7.dev2",
]
gcloud = [
    "cs-image-system-gcloud-runtime-plugin==0.1.7.dev2",
    "cs-image-system-tf-gcp-plugin==0.1.7.dev2",
    "cs-image-system-gcs-state-plugin==0.1.7.dev2",
]
docker = [
    "cs-image-system-docker-runtime-plugin==0.1.7.dev2",
    "cs-image-system-tf-docker-plugin==0.1.7.dev2",
]
okta = [
    "cs-image-system-okta-opa-plugin==0.1.7.dev2",
]
all = [
    "cs-image-system-aws-runtime-plugin==0.1.7.dev2",
    "cs-image-system-tf-ebs-instance-plugin==0.1.7.dev2",
    "cs-image-system-tf-s3-state-plugin==0.1.7.dev2",
    "cs-image-system-gcloud-runtime-plugin==0.1.7.dev2",
    "cs-image-system-tf-gcp-plugin==0.1.7.dev2",
    "cs-image-system-gcs-state-plugin==0.1.7.dev2",
    "cs-image-system-docker-runtime-plugin==0.1.7.dev2",
    "cs-image-system-tf-docker-plugin==0.1.7.dev2",
    "cs-image-system-okta-opa-plugin==0.1.7.dev2",
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-3"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
Configuration = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/CONFIGURATION.md"

# `uv tool install cs-image-system` exposes only the requested package's
# executables, and this package had none (the console script is the system package's),
# so the install ended with "Failed to install entrypoints" -- found by the reference
# configuration's first CI run. The same script, declared here too, names
# the module the pinned dependency provides; both declarations point at one function.
[project.scripts]
cs-image-system = "cs_image_system.system.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "LICENSE", "src"]

# the extras table, read by the core when a `type:` word resolves to no installed plugin
[project.entry-points."cs_image_system.extras"]
umbrella = "cs_image_system.extras"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cs-image-system-base = { workspace = true }
cs-image-system-contract = { workspace = true }
cs-image-system-contract-example-plugin = { workspace = true }
cs-image-system-system = { workspace = true }
cs-image-system-okta-opa-plugin = { workspace = true }
cs-image-system-aws-runtime-plugin = { workspace = true }
cs-image-system-gcloud-runtime-plugin = { workspace = true }
cs-image-system-packer-plugin = { workspace = true }
cs-image-system-ansible-plugin = { workspace = true }
cs-image-system-bash-mod-plugin = { workspace = true }
cs-image-system-dummy-plugin = { workspace = true }
cs-image-system-tf-ebs-instance-plugin = { workspace = true }
cs-image-system-tf-gcp-plugin = { workspace = true }
cs-image-system-default-os-plugin = { workspace = true }
cs-image-system-tf-s3-state-plugin = { workspace = true }
cs-image-system-hashicorp-utils = { workspace = true }
cs-image-system-local-state-plugin = { workspace = true }
cs-image-system-posix-identity-plugin = { workspace = true }
cs-image-system-gcs-state-plugin = { workspace = true }
cs-image-system-docker-runtime-plugin = { workspace = true }
cs-image-system-tf-docker-plugin = { workspace = true }
cs-image-system-tofu-roots = { workspace = true }

# The indexes a release is published to: `uv publish --index <name>` reads the
# publish-url and skips files already present with the same content (the url is the check
# url). Both are explicit, so neither takes part in resolving this workspace's dependencies;
# a consumer installs from TestPyPI with PyPI as the extra index (docs/OPERATIONS.md,
# "Installing a release").
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

# The one place a version changes: `bump-my-version bump <part>` moves the
# `version =` line of every package and every `== <version>` pin between them at once; the
# release recipe then refreshes the lock, commits and tags. Scheme MAJOR.MINOR.PATCH[.devN]:
# `bump patch` (or minor, major) opens the next version as its first development release
# (0.1.0 -> 0.1.1.dev1), `bump dev` is the next development release of the same version
# (0.1.1.dev1 -> 0.1.1.dev2), `bump stage` finalises it (0.1.1.dev2 -> 0.1.1). A missing
# stage reads as final, a bumped part resets the parts after it to their first values.
[tool.bumpversion]
current_version = "0.1.7.dev2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.(?P<stage>dev)(?P<dev>\\d+))?"
serialize = ["{major}.{minor}.{patch}.{stage}{dev}", "{major}.{minor}.{patch}"]
commit = false
tag = false

[tool.bumpversion.parts.stage]
values = ["dev", "final"]
optional_value = "final"

[tool.bumpversion.parts.dev]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "=={current_version}\""
replace = "=={new_version}\""

[[tool.bumpversion.files]]
glob = "packages/*/pyproject.toml"
glob_exclude = ["packages/contract/pyproject.toml"]     # the contract's version is its own; its dependents pin a range
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
glob = "packages/*/pyproject.toml"
glob_exclude = ["packages/contract/pyproject.toml"]     # the contract depends on no other package
ignore_missing_version = true                            # a package that depends on the contract alone has no == pin
search = "=={current_version}\""
replace = "=={new_version}\""

[tool.pytest.ini_options]
testpaths = ["tests",
 "packages/base/tests",
  "packages/system/tests",
   "packages/okta-opa-plugin/tests",
   "packages/packer-plugin/tests",
   "packages/aws-runtime-plugin/tests",
   "packages/gcloud-runtime-plugin/tests",
   "packages/ansible-plugin/tests",
   "packages/bash-mod-plugin/tests",
   "packages/tf-ebs-instance-plugin/tests",
   "packages/tf-gcp-plugin/tests",
   "packages/default-os-plugin/tests",
   "packages/hashicorp-utils/tests",
   "packages/local-state-plugin/tests",
   "packages/posix-identity-plugin/tests",
   "packages/gcs-state-plugin/tests",
   "packages/docker-runtime-plugin/tests",
   "packages/tf-docker-plugin/tests",
   "packages/tofu-roots/tests",
   "packages/contract/tests",
   "packages/contract-example-plugin/tests",
   "packages/dummy-plugin/tests",
   "packages/tf-s3-state-plugin/tests"
   ]
pythonpath = [
    "tests",
    "src",
    "packages/base/src",
    "packages/contract/src",
    "packages/contract-example-plugin/src",
    "packages/system/src",
    "packages/okta-opa-plugin/src",
    "packages/packer-plugin/src",
    "packages/aws-runtime-plugin/src",
    "packages/gcloud-runtime-plugin/src",
    "packages/ansible-plugin/src",
    "packages/bash-mod-plugin/src",
    "packages/dummy-plugin/src",
    "packages/tf-ebs-instance-plugin/src",
    "packages/tf-gcp-plugin/src",
    "packages/default-os-plugin/src",
    "packages/docker-runtime-plugin/src",
    "packages/tf-docker-plugin/src",
    "packages/gcs-state-plugin/src",
    "packages/hashicorp-utils/src",
    "packages/tofu-roots/src",
    "packages/local-state-plugin/src",
    "packages/posix-identity-plugin/src",
    "packages/tf-s3-state-plugin/src",
]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    # the two workspace-only plugins: the extension template and the contract's
    # proof are installed with the workspace and never published (their pyproject's
    # `Private :: Do Not Upload` classifier); the == pin moves with the bump like any other
    "cs-image-system-dummy-plugin==0.1.7.dev2",
    "cs-image-system-contract-example-plugin==0.1.7.dev2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "pyright>=1.1.390",
    "reuse>=6.2.0",
    "bump-my-version>=1.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", "generated", "**/generated"]

[tool.ruff.lint]
# Conservative, high-signal rules: pyflakes (unused imports/vars, undefined names,
# redefinitions) + syntax errors. Style/import-ordering rules are intentionally left
# off for now to avoid large churn on this codebase.
select = ["F", "E9", "C90", "B", "I"]

[tool.ruff.lint.mccabe]
# The complexity ceiling (C901) is the measured maximum, so it can only fall
# from here. Measured over src, packages, tests and scripts: 93 functions
# above 10, 47 above 12, 22 above 15, 6 above 20, 4 above 25, 2 above 30,
# 1 above 40. The six above 20 are the next cuts, highest first:
# read_config_and_transform (49), resolve_all (33), run_lifecycles (28),
# measure_file (28), register_provider_aliases (25),
# upgrade_deferred_list_generated (23). Lower the number after each cut.
max-complexity = 49

[tool.ruff.lint.isort]
# The namespace's source roots sit under packages/*/src, which ruff does not
# search, so without this every own import would sort as third-party.
known-first-party = ["cs_image_system"]

[tool.pyright]
# "basic" mode, blocking (0 errors is the bar), with the override
# check on; strict typing is not enforced yet.
# NB: "packages/*/src" matches nothing in pyright's spec globbing (it silently
# analyzed 0 files, which also broke find-all-references); use ** instead.
include = ["src", "packages/**/src", "packages/**/tests", "tests"]
exclude = ["**/.venv", "**/generated"]
# Resolve cross-package imports of the cs_image_system namespace directly from
# source instead of through the venv's editable-install .pth files; otherwise
# Pylance treats them as library code and find-references/rename only sees open
# files. Globs are not supported in extraPaths, so each src root is listed.
extraPaths = [
    "tests",
    "src",
    "packages/ansible-plugin/src",
    "packages/aws-runtime-plugin/src",
    "packages/base/src",
    "packages/bash-mod-plugin/src",
    "packages/contract/src",
    "packages/contract-example-plugin/src",
    "packages/default-os-plugin/src",
    "packages/docker-runtime-plugin/src",
    "packages/tf-docker-plugin/src",
    "packages/dummy-plugin/src",
    "packages/gcloud-runtime-plugin/src",
    "packages/gcs-state-plugin/src",
    "packages/hashicorp-utils/src",
    "packages/tofu-roots/src",
    "packages/local-state-plugin/src",
    "packages/posix-identity-plugin/src",
    "packages/okta-opa-plugin/src",
    "packages/packer-plugin/src",
    "packages/system/src",
    "packages/tf-ebs-instance-plugin/src",
    "packages/tf-gcp-plugin/src",
    "packages/tf-s3-state-plugin/src",
]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "warning"
# Basic mode compares no override's
# signature with the base's or the protocol's, so a base class could narrow or
# widen a contract signature unnoticed. On, as an error, over the whole workspace.
reportIncompatibleMethodOverride = "error"

